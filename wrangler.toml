# Compatible with Wrangler 3.x (Cloudflare Workers Builds)
# run_worker_first must be boolean in wrangler@3 — array only in wrangler@4
name = "mysportzstats"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# boolean ONLY (wrangler 3). Worker handles every request first.
# HTML served via env.ASSETS.fetch("https://assets.local/...") — never fetch(request)
run_worker_first = true

[vars]
ADMIN_KEY = "mysportz-admin-2024"
