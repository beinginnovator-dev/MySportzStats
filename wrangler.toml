# Wrangler 3.x compatible — run_worker_first must be boolean
name = "mysportzstats"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mysportzstats-match-history"
database_id = "316aaea3-f581-4e00-bc90-036d91cbef08"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ADMIN_KEY = "mysportz-admin-2024"
