# Cloudflare Workers + Static Assets (official routing pattern)
# https://developers.cloudflare.com/workers/static-assets/binding/
name = "mysportzstats"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# Worker-first ONLY where we need dynamic handling / path aliases.
# "/" and "/index.html" stay asset-first (no redirect loops).
# https://developers.cloudflare.com/workers/static-assets/routing/worker-script/
run_worker_first = [
  "/api/*",
  "/ws",
  "/m/*",
  "/live",
  "/live.html",
  "/live-react",
  "/live-react.html",
  "/viewer",
  "/viewers",
  "/viewer.html"
]

[vars]
ADMIN_KEY = "mysportz-admin-2024"
