name = "mysportzstats"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# Only these paths hit the Worker first (fixes /live-react.html 404).
# Do NOT include "/" or "/index.html" — those are pure static (avoids redirect loop).
run_worker_first = ["/live", "/live.html", "/live-react", "/live-react.html", "/viewer", "/viewers", "/ws", "/api/*", "/m/*"]

[vars]
ADMIN_KEY = "mysportz-admin-2024"
