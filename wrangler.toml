name = "mysportzstats"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"

# App creator only — set a strong secret, then use header X-Admin-Key for ad APIs
[vars]
ADMIN_KEY = "mysportz-admin-2024"
