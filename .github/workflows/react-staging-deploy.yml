name: Build React staging package

on:
  push:
    branches:
      - react-redesign-2026-11-14
    paths:
      - "react-app/**"
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "vite.react.config.js"
      - "wrangler.staging.toml"
      - ".github/workflows/react-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Bundle Worker for staging
        run: npx wrangler deploy --dry-run --outdir dist --config wrangler.staging.toml
      - name: Upload React and Worker deployment package
        uses: actions/upload-artifact@v4
        with:
          name: react-staging-package
          path: |
            public/react/**
            dist/**
          if-no-files-found: error
