name: Staging browser smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-browser-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test staging site in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(err.message));
            const url = 'https://mysportzstats-e2e-staging.being-innovator.workers.dev/?utm_source=chatgpt.com';
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(10000);
            const title = await page.title();
            const bodyText = (await page.locator('body').innerText().catch(() => '')).trim();
            await page.screenshot({ path: 'staging-homepage.png', fullPage: true });
            const report = {
              url, httpStatus: response?.status() ?? null, title,
              bodyTextLength: bodyText.length,
              bodyPreview: bodyText.slice(0, 1200),
              consoleErrors, pageErrors
            };
            require('fs').writeFileSync('browser-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (!response || !response.ok()) throw new Error('Staging page did not return a successful HTTP response');
            if (bodyText.length < 20) throw new Error('Staging page rendered no meaningful body text');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence
          path: |
            staging-homepage.png
            browser-report.json
          if-no-files-found: ignore
