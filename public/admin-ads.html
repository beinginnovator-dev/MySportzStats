<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Platform Ads Admin</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:540px;margin:20px auto;padding:16px;background:#0f172a;color:#f8fafc}
input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin:6px 0 12px;box-sizing:border-box}
button{background:#059669;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:6px}
button.danger{background:#b91c1c}
button.secondary{background:#334155}
label{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;display:block}
pre{background:#1e293b;padding:12px;border-radius:8px;overflow:auto;font-size:12px;min-height:40px;white-space:pre-wrap}
h1{font-size:1.2rem;margin:0 0 8px}
code{color:#34d399;font-size:12px}
.hint{opacity:.85;font-size:13px;line-height:1.45;margin:0 0 14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin:12px 0}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.presets button{margin:0;padding:10px;font-size:12px;background:#0e7490}
.preview{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.preview img{max-width:100%;border-radius:8px;border:1px solid #334155;background:#020617}
.preview .rect{width:100%;max-height:100px;object-fit:cover}
.preview .vert{width:120px;max-height:180px;object-fit:cover}
</style>
</head>
<body>
<h1>📢 Platform Ad Banners</h1>
<p class="hint">App creator only. Banners show on <b>all</b> live viewer links.</p>
<div class="card">
  <b>Default admin key:</b> <code>mysportz-admin-2024</code><br/>
  <span class="hint">Must match <code>wrangler.toml</code> → <code>ADMIN_KEY</code>, or your Cloudflare Secret of the same name.</span>
</div>
<label>Admin key</label>
<input id="key" type="password" value="mysportz-admin-2024" autocomplete="off"/>
<label>Ad text</label>
<textarea id="text" rows="2">Get Free Cric-Scorer — publish live scores like pros. Tap to open.</textarea>
<label>Image URL (public https JPG/PNG)</label>
<input id="img" placeholder="https://..."/>
<label>Quick banner presets</label>
<div class="presets">
  <button type="button" onclick="usePreset('rect')">Rectangle banner</button>
  <button type="button" onclick="usePreset('vert')">Vertical banner</button>
</div>
<div class="preview" id="preview"></div>
<label>Click link URL</label>
<input id="href" value="https://mysportzstats.being-innovator.workers.dev/"/>
<label>Position</label>
<select id="pos">
  <option value="top">Top of viewer page</option>
  <option value="bottom">Bottom sticky</option>
</select>
<button onclick="pushAd()">Push banner to all viewers</button>
<button class="danger" onclick="clearAds()">Clear all banners</button>
<button class="secondary" onclick="loadAds()">Refresh current banners</button>
<pre id="out">Ready. Use key: mysportz-admin-2024</pre>
<script>
var PRESETS = {
  rect: {
    text: "Free Cric-Scorer App — Live ball-by-ball scores, share on WhatsApp. Tap to get started!",
    img: "https://placehold.co/1200x300/0f766e/ecfdf5/png?text=Free+Cric-Scorer+%E2%80%94+Live+Scores+%26+WhatsApp+Share",
    href: location.origin + "/"
  },
  vert: {
    text: "MySportzStats Live Scorer\nScore. Share. Go Live.",
    img: "https://placehold.co/600x900/115e59/ecfdf5/png?text=MySportzStats%0ALive+Cricket+Scorer%0ATap+to+Open",
    href: location.origin + "/"
  }
};
function usePreset(kind){
  var p = PRESETS[kind] || PRESETS.rect;
  document.getElementById('text').value = p.text;
  document.getElementById('img').value = p.img;
  document.getElementById('href').value = p.href;
  showPreview();
}
function showPreview(){
  var img = (document.getElementById('img').value||'').trim();
  var box = document.getElementById('preview');
  if(!img){ box.innerHTML = ''; return; }
  var isVert = /600x900|900x1200|vertical/i.test(img);
  box.innerHTML = '<img class="'+(isVert?'vert':'rect')+'" src="'+img.replace(/"/g,'')+'" alt="preview" onerror="this.alt=\'Image failed to load\'"/>';
}
document.getElementById('img').addEventListener('input', showPreview);

async function pushAd(){
  var key=document.getElementById('key').value.trim();
  var img=(document.getElementById('img').value||'').trim();
  if(img && !/^https:\/\//i.test(img)){
    document.getElementById('out').textContent='Image URL must start with https://';
    return;
  }
  var body={
    adminKey: key,
    key: key,
    banners:[{
      id:'ad1', enabled:true,
      text:document.getElementById('text').value.trim(),
      imageUrl:img,
      linkUrl:document.getElementById('href').value.trim(),
      position:document.getElementById('pos').value
    }]
  };
  try{
    var r=await fetch('/api/admin/ads?key='+encodeURIComponent(key),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Key':key},
      body:JSON.stringify(body)
    });
    var data=await r.json().catch(function(){return {};});
    document.getElementById('out').textContent=JSON.stringify(data,null,2);
    if(data && data.ok===false && data.error==='unauthorized'){
      document.getElementById('out').textContent +=
        "\n\nFix:\n1) Type key exactly: mysportz-admin-2024\n2) Or set Cloudflare Secret ADMIN_KEY to that value\n3) Redeploy worker after changing wrangler.toml [vars]";
    }
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
async function clearAds(){
  var key=document.getElementById('key').value.trim();
  try{
    var r=await fetch('/api/admin/ads?key='+encodeURIComponent(key),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Key':key},
      body:JSON.stringify({adminKey:key,key:key,banners:[]})
    });
    var data=await r.json().catch(function(){return {};});
    document.getElementById('out').textContent='CLEAR\n'+JSON.stringify(data,null,2);
    if(data && data.ok===false && data.error==='unauthorized'){
      document.getElementById('out').textContent +=
        "\n\nUnauthorized = wrong ADMIN_KEY on the server.\nUse: mysportz-admin-2024\nOr update Cloudflare Secret ADMIN_KEY and redeploy.";
    }
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
async function loadAds(){
  try{
    var r=await fetch('/api/ads',{cache:'no-store'});
    document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
// default rectangle preset image
if(!document.getElementById('img').value) usePreset('rect');
loadAds();
</script>
</body>
</html>
