<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Platform Ads Admin</title>
<style>
body{font-family:system-ui;max-width:520px;margin:24px auto;padding:16px;background:#0f172a;color:#f8fafc}
input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin:6px 0 12px;box-sizing:border-box}
button{background:#059669;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:6px}
button.danger{background:#b91c1c}
label{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase}
pre{background:#1e293b;padding:12px;border-radius:8px;overflow:auto;font-size:12px;min-height:40px}
h1{font-size:1.2rem}
code{color:#34d399}
.hint{opacity:.8;font-size:13px;line-height:1.5}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin:12px 0}
</style>
</head>
<body>
<h1>📢 Platform Ad Banners</h1>
<p class="hint">App creator only. Banners appear on <b>all</b> viewer links via the worker API.</p>
<div class="card">
  <b>Admin key:</b> <code>mysportz-admin-2024</code><br/>
  <span class="hint">Header: <code>X-Admin-Key</code> · Also in <code>wrangler.toml</code> → <code>ADMIN_KEY</code></span>
</div>
<label>Admin key</label>
<input id="key" type="password" value="mysportz-admin-2024"/>
<label>Ad text</label>
<textarea id="text" rows="2" placeholder="Try Premium Scorer — free this week"></textarea>
<label>Image URL (must be public https:// JPG/PNG — not SVG)</label>
<input id="img" placeholder="https://m.media-amazon.com/images/I/....jpg"/>
<label>Click link URL</label>
<input id="href" placeholder="https://your-site.com/offer"/>
<label>Position</label>
<select id="pos">
  <option value="top">Top of viewer page</option>
  <option value="bottom">Bottom sticky</option>
</select>
<button onclick="pushAd()">Push banner to all viewers</button>
<button class="danger" onclick="clearAds()">Clear all platform banners</button>
<button onclick="loadAds()" style="background:#334155">Refresh current banners</button>
<pre id="out">Ready. Admin key: mysportz-admin-2024</pre>
<script>
async function pushAd(){
  const key=document.getElementById('key').value.trim();
  const img=(document.getElementById('img').value||'').trim();
  if(img && !/^https:\/\//i.test(img)){
    document.getElementById('out').textContent='Image URL must start with https:// (WhatsApp & viewers reject relative/SVG).';
    return;
  }
  const body={banners:[{
    id:'ad1', enabled:true,
    text:document.getElementById('text').value.trim(),
    imageUrl:img,
    linkUrl:document.getElementById('href').value.trim(),
    position:document.getElementById('pos').value
  }]};
  try{
    const r=await fetch('/api/admin/ads',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(body)});
    document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
async function clearAds(){
  const key=document.getElementById('key').value.trim();
  try{
    const r=await fetch('/api/admin/ads',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({banners:[]})});
    document.getElementById('out').textContent='CLEARED\n'+JSON.stringify(await r.json(),null,2);
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
async function loadAds(){
  try{
    const r=await fetch('/api/ads',{cache:'no-store'});
    document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);
  }catch(e){ document.getElementById('out').textContent=String(e); }
}
loadAds();
</script>
</body>
</html>
