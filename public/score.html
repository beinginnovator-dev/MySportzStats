<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Scorer</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 16px; }
    button { margin: 4px; padding: 14px 18px; font-size: 1.15rem; border-radius: 10px; border: none; cursor: pointer; background: #334155; color: #e2e8f0; font-weight: 600; }
    button:active { background: #475569; }
    .row { margin: 14px 0; display: flex; flex-wrap: wrap; gap: 6px; }
    #status { margin-bottom: 14px; opacity: 0.85; font-size: 0.95rem; }
    pre { background: #1e293b; padding: 14px; border-radius: 10px; font-size: 0.85rem; max-height: 220px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Live Scorer</h1>
  <div id="status">Connecting…</div>
  <div class="row">
    <button onclick="add(1)">1</button>
    <button onclick="add(2)">2</button>
    <button onclick="add(3)">3</button>
    <button onclick="add(4)">4</button>
    <button onclick="add(6)">6</button>
    <button onclick="add(0)">Dot</button>
    <button onclick="wicket()">Wicket</button>
  </div>
  <div class="row">
    <button onclick="endMatch()">End Match</button>
    <button onclick="resetOver()">New Over</button>
  </div>
  <pre id="log"></pre>

  <script>
    const MATCH = new URLSearchParams(location.search).get("match") || "default";
    let ws;
    let state = {
      score: { runs: 0, wickets: 0, overs: "0.0", innings: 1 },
      thisOver: [],
      lastEvent: null,
      matchEnded: false,
      maxOvers: 8,
      target: null,
    };

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?match=${MATCH}&name=Scorer&role=scorer`);
      ws.onopen = () => {
        document.getElementById("status").textContent = "● Connected as scorer";
        log("Connected");
      };
      ws.onclose = () => {
        document.getElementById("status").textContent = "Reconnecting…";
        setTimeout(connect, 1500);
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "full" || msg.type === "update") {
            state = { ...state, ...msg.data };
          }
        } catch (_) {}
      };
    }

    function push() {
      if (ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "score", data: state }));
        log(`Pushed: ${state.score.runs}/${state.score.wickets} (${state.score.overs})`);
      }
    }

    function add(runs) {
      if (state.matchEnded) return;
      state.score.runs += runs;
      state.thisOver.push(runs === 0 ? "•" : String(runs));
      state.lastEvent = {
        event: runs >= 4 ? "boundary" : "runs",
        runs,
        ts: Date.now(),
      };
      // simple over progression (demo)
      const [o, b] = state.score.overs.split(".").map(Number);
      if (b === 5) {
        state.score.overs = (o + 1) + ".0";
        state.thisOver = [];
      } else {
        state.score.overs = o + "." + (b + 1);
      }
      push();
    }

    function wicket() {
      if (state.matchEnded) return;
      state.score.wickets += 1;
      state.thisOver.push("W");
      state.lastEvent = { event: "W", runs: 0, ts: Date.now() };
      const [o, b] = state.score.overs.split(".").map(Number);
      if (b === 5) {
        state.score.overs = (o + 1) + ".0";
        state.thisOver = [];
      } else {
        state.score.overs = o + "." + (b + 1);
      }
      push();
    }

    function endMatch() {
      state.matchEnded = true;
      state.lastEvent = null;
      push();
      log("Match ended");
    }

    function resetOver() {
      state.thisOver = [];
      push();
    }

    function log(t) {
      const el = document.getElementById("log");
      el.textContent += t + "\n";
      el.scrollTop = el.scrollHeight;
    }

    connect();
  </script>
</body>
</html>
