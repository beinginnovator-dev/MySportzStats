<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MySportz Live · International</title>
<meta name="theme-color" content="#0b1220"/>
<style>
:root{--bg:#0b1220;--bg2:#111827;--card:#1a2336;--line:rgba(255,255,255,.08);--text:#f8fafc;--muted:#94a3b8;--red:#e11d48;--gold:#fbbf24;--blue:#38bdf8;--accent:#e11d48}
body.theme-light{--bg:#fff;--bg2:#fff;--card:#fff;--line:rgba(15,23,42,.1);--text:#0f172a;--muted:#64748b;--accent:#0f766e;--blue:#0284c7}
body.theme-ipl{--bg:#0c0a1a;--bg2:#16132a;--card:#221c40;--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#a5b4fc;--accent:#7c3aed;--blue:#a78bfa}
body.theme-icc{--bg:#071a14;--bg2:#0c241c;--card:#134032;--line:rgba(255,255,255,.1);--text:#ecfdf5;--muted:#6ee7b7;--accent:#059669;--blue:#34d399}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--blue)}
.app{max-width:480px;margin:0 auto;padding-bottom:28px}
.broadcast{
  background:linear-gradient(180deg,rgba(11,18,32,.9),rgba(11,18,32,.94)),url('https://images.unsplash.com/photo-1531415076815-8dd6c0d1f2f2?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;
  border-bottom:1px solid var(--line);padding:10px 12px 12px;position:relative;overflow:hidden
}
body.theme-light .broadcast{
  background:linear-gradient(180deg,rgba(11,30,75,.92),rgba(10,36,99,.94)),url('https://images.unsplash.com/photo-1531415076815-8dd6c0d1f2f2?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;
  color:#f8fafc
}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;position:relative;z-index:2}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(225,29,72,.15);border:1px solid rgba(225,29,72,.45);color:#fecdd3;font-size:11px;font-weight:900;padding:4px 8px;border-radius:999px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.bar-mid{text-align:center;flex:1;min-width:0;padding:0 6px}
.bar-mid .title{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);line-height:1.2}
.bar-mid .sub{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.35}
body.theme-light .broadcast .bar-mid .title{color:#fde68a}
body.theme-light .broadcast .bar-mid .sub{color:#cbd5e1}
.gear{border:1px solid var(--line);background:rgba(255,255,255,.06);color:inherit;border-radius:999px;width:34px;height:34px;cursor:pointer}
.settings-backdrop{position:fixed;inset:0;z-index:9998}
.settings-dd{position:fixed;right:12px;top:56px;z-index:9999;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:14px;min-width:240px;max-height:75vh;overflow:auto;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
body.theme-light .settings-dd{background:#fff;border-color:#cbd5e1}
.settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;padding:6px 12px 4px}
.settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#f8fafc;font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer}
body.theme-light .settings-dd button{color:#0f172a}
.settings-dd button.on,.settings-dd button:hover{background:rgba(56,189,248,.22)}
.settings-dd .sep{height:1px;background:rgba(255,255,255,.12);margin:6px 8px}
/* Increased spacing between match header and score grid */
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;position:relative;z-index:1;margin-top:28px}
.side{text-align:center;min-width:0}
.tname{font-size:10px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px}
.tname img{width:22px;height:16px;object-fit:cover;border-radius:3px}
.tname img.wave{animation:flagWave 1.1s ease-in-out infinite;transform-origin:left center}
@keyframes flagWave{0%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}100%{transform:rotate(-6deg)}}
.score-num{font-size:26px;font-weight:900;line-height:1.1;margin:2px 0 0}
.overs{font-size:12px;color:var(--muted);margin-top:1px;font-weight:700}
.role{font-size:9px;color:var(--blue);font-weight:800;margin-top:1px;text-transform:uppercase}
.match-center{text-align:center;min-width:64px}
.match-center .vs-label{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--muted)}
body.theme-light .broadcast .match-center .vs-label,.body.theme-light .broadcast .overs{color:#cbd5e1}
.crr{display:flex;justify-content:center;gap:14px;margin-top:6px;font-size:11px;color:var(--muted);position:relative;z-index:1}
.crr b{color:inherit;opacity:.95}
body.theme-light .broadcast .crr{color:#cbd5e1}
.anim-slot{min-height:36px;margin-top:4px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.ev-banner{min-width:120px;padding:10px 16px;border-radius:14px;font-weight:900;font-size:15px;text-align:center;color:#fff;opacity:0;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.ev-banner.show{animation:evpop 2.6s ease-out forwards}
.ev-banner.runs{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.ev-banner.four{background:linear-gradient(135deg,#16a34a,#22c55e)}
.ev-banner.six{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.ev-banner.dot{background:linear-gradient(135deg,#475569,#64748b)}
.ev-banner.extra{background:linear-gradient(135deg,#6d28d9,#a855f7)}
.ev-banner.wicket{background:linear-gradient(135deg,#b91c1c,#ef4444)}
@keyframes evpop{0%{opacity:0;transform:scale(.85)}12%{opacity:1;transform:scale(1.06)}70%{opacity:1}100%{opacity:0}}
.result-wrap{position:relative;overflow:hidden;border-radius:14px;margin-top:10px;z-index:2}
.result{padding:14px 12px;background:linear-gradient(135deg,#9a3412,#ea580c 55%,#f59e0b);text-align:center;color:#fff;border-radius:14px;position:relative;z-index:2}
.result .lbl{font-size:10px;font-weight:900;letter-spacing:.14em}
.result .txt{font-size:16px;font-weight:900;margin:4px 0}
.result .sc{font-size:12px;line-height:1.45}
.result .pom{margin-top:6px;font-size:12px;font-weight:800;color:#fef3c7}
.cracker{position:absolute;inset:0;z-index:1;pointer-events:none}
.cracker i{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall 2.2s linear infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(130px) rotate(320deg);opacity:0}}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:900}
.bat-bowl{display:grid;grid-template-columns:1.25fr 1px 1fr;gap:0 10px}
.bat-col{display:flex;flex-direction:column;gap:8px}
.vdiv{background:var(--line);width:1px}
.bowl-col{display:flex;flex-direction:column;justify-content:center}
.pbox{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.pbox .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.pbox .v{font-size:15px;font-weight:800;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:#475569}
.chip.c0{background:#64748b}.chip.c1{background:#2563eb}.chip.c4{background:#16a34a}.chip.c6{background:#7c3aed}.chip.cw{background:#e11d48}.chip.cx{background:#9333ea}
.comm-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
.subtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.subtabs button{flex:1;min-width:40%;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px;font-weight:800;font-size:12px;cursor:pointer}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv .item{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.kv .item .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
.kv .item .v{font-size:14px;font-weight:800;margin-top:4px}
.caps-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.caps-row{grid-template-columns:1fr}}
.welcome{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:16px}
.welcome .box{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.footer{text-align:center;padding:14px;font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
#error{display:none;padding:16px;color:#fecaca;background:#450a0a;font-size:13px}
</style>
</head>

window.onerror = function(msg, src, line) {
  var e = document.getElementById('error');
  if (e) { e.style.display = 'block'; e.textContent = 'Error: ' + msg + ' @ line ' + line; }
};
</script>

function playSfx(vol) {
  try {
    if (localStorage.getItem('cricket_sound_master') === '0') return;
    if (localStorage.getItem('cricket_stadium_on') === '0') return;
    const a = new Audio('https://cdn.freesound.org/previews/342/342749_5121236-lq.mp3');
    a.volume = vol == null ? 0.12 : vol;
    a.play().catch(function() {});
  } catch (e) {}
}
function stadiumForEvent(ev) {
  if (!ev) return;
  if (ev.kind === 'wicket' || ev.kind === 'four' || ev.kind === 'six') playSfx(ev.kind === 'six' ? 0.18 : 0.12);
}

function teamLines(d) {
  if (!d) return { batA: [], bowlA: [], batB: [], bowlB: [], nameA: 'Team A', nameB: 'Team B', batting: 'A' };
  const first = String(d.firstBattingTeam || 'A').toUpperCase() === 'B' ? 'B' : 'A';
  const i1b = d.innings1Batters || [];
  const i1o = d.innings1Bowlers || [];
  const i2b = d.innings2Batters || [];
  const i2o = d.innings2Bowlers || [];
  const nameA = d.teamA || d.teamAName || 'Team A';
  const nameB = d.teamB || d.teamBName || 'Team B';
  const batA = first === 'A' ? i1b : i2b;
  const batB = first === 'B' ? i1b : i2b;
  const bowlA = first === 'A' ? i2o : i1o;
  const bowlB = first === 'B' ? i2o : i1o;
  let batting = 'A';
  if (d.battingTeam === 'B' || d.battingTeam === nameB) batting = 'B';
  else if (n(d.currentInnings) >= 2) batting = first === 'A' ? 'B' : 'A';
  else batting = first;
  return { batA: batA, bowlA: bowlA, batB: batB, bowlB: bowlB, nameA: nameA, nameB: nameB, batting: batting };
}

function useLiveMatch() {
  const [data, setData] = useState(null);
  const [viewers, setViewers] = useState([]);
  const [connected, setConnected] = useState(false);
  const lastSig = useRef('');
  const wsRef = useRef(null);
  const apply = useCallback(function(raw) {
    const d = unwrap(raw);
    if (!d) return;
    const chip = (d.thisOver && d.thisOver.balls) ? d.thisOver.balls.join(',') : '';
    const sig = [d.balls, d.runs, d.wickets, d.ts, chip].join('|');
    if (sig === lastSig.current) return;
    lastSig.current = sig;
    setData(d);
    if (Array.isArray(d.viewers)) setViewers(d.viewers);
  }, []);

  useEffect(function() {
    const match = new URLSearchParams(window.location.search).get('match') || 'current';
    let dead = false, retry = 0, pollTimer;
    function connect() {
      if (dead) return;
      try {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(proto + '//' + window.location.host + '/ws?match=' + encodeURIComponent(match) + '&name=ReactFan');
        wsRef.current = ws;
        ws.onopen = function() { setConnected(true); retry = 0; };
        ws.onmessage = function(ev) {
          try {
            const msg = JSON.parse(ev.data);
            if (!msg || msg.type === 'pong') return;
            if (msg.type === 'presence') {
              setViewers(Array.isArray(msg.data) ? msg.data : []);
              return;
            }
            if (msg.type === 'full' || msg.type === 'update' || msg.type === 'score' || msg.runs != null) apply(msg.data || msg);
          } catch (e) {}
        };
        ws.onclose = function() {
          setConnected(false);
          setTimeout(connect, Math.min(15000, 800 + retry++ * 700));
        };
      } catch (e) {}
    }
    connect();
    function poll() {
      if (wsRef.current && wsRef.current.readyState === 1) return;
      fetch('/api/live-public?match=' + encodeURIComponent(match) + '&_=' + Date.now(), { cache: 'no-store' })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(j) { if (j) apply(j); })
        .catch(function() {});
    }
    pollTimer = setInterval(poll, 5000);
    poll();
    return function() {
      dead = true;
      clearInterval(pollTimer);
      try { if (wsRef.current) wsRef.current.close(); } catch (e) {}
    };
  }, [apply]);
  return { data: data, viewers: viewers, connected: connected };
}

function BatTable(props) {
  const list = props.list || [];
  if (!list.length) return <div className="muted">Yet to bat</div>;
  return (
    <table>
      <thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
      <tbody>
        {list.map(function(p, i) {
          return (
            <tr key={i}>
              <td>{p.name || '-'}{p.isOut ? '' : ' *'}</td>
              <td>{n(p.runs)}</td><td>{n(p.balls)}</td><td>{n(p.fours)}</td><td>{n(p.sixes)}</td>
              <td>{sr(p.runs, p.balls)}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function BowlTable(props) {
  const list = props.list || [];
  if (!list.length) return <div className="muted">Yet to bowl</div>;
  return (
    <table>
      <thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
      <tbody>
        {list.map(function(p, i) {
          const bb = p.bowlBalls != null ? n(p.bowlBalls) : n(p.balls);
          const rr = p.bowlRuns != null ? n(p.bowlRuns) : n(p.runs);
          return (
            <tr key={i}>
              <td>{p.name || '-'}</td>
              <td>{oversFromBalls(bb)}</td><td>{rr}</td><td>{n(p.wickets)}</td><td>{econ(rr, bb)}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function Welcome(props) {
  const data = props.data;
  useEffect(function() {
    const t = setTimeout(props.onDone, 10000);
    return function() { clearTimeout(t); };
  }, [props.onDone]);
  const ta = (data && (data.teamA || data.teamAName)) || 'Team A';
  const tb = (data && (data.teamB || data.teamBName)) || 'Team B';
  const runs = data && data.runs != null ? data.runs : '-';
  const wk = data && data.wickets != null ? data.wickets : '-';
  const ov = (data && data.overs) || '-';
  const startTs = matchStartTs(data);
  return (
    <div className="welcome" onClick={props.onDone}>
      <div className="box">
        <div style={{ fontSize: 11, fontWeight: 900, letterSpacing: '.14em', color: 'var(--red)' }}>LIVE CRICKET</div>
        <div style={{ fontSize: 18, fontWeight: 900, margin: '8px 0' }}>{ta} vs {tb}</div>
        <div className="muted">{data && data.matchEnded ? (data.matchResult || 'Match completed') : (data && data.runs != null ? ('Live · ' + runs + '/' + wk + ' (' + ov + ')') : 'Waiting for scoring')}</div>
        <div style={{ fontSize: 26, fontWeight: 900, margin: '10px 0' }}>{runs}/{wk} <span style={{ fontSize: 14 }}>({ov})</span></div>
        <div className="muted" style={{ fontSize: 12 }}>
          Start {startTs ? fmtClock(startTs) : '-'} · Elapsed {startTs ? fmtElapsed(Date.now() - startTs) : '00:00'}
        </div>
      </div>
    </div>
  );
}

                <tbody>
                  {(data && data.orangeCap ? data.orangeCap.slice(0, 12) : []).map(function(p, i) {
                    return <tr key={i}><td>{i + 1}</td><td>{p.name}</td><td>{p.runs || 0}</td><td>{p.avg != null ? p.avg : (p.average != null ? p.average : '-')}</td></tr>;
                  })}
                  {!(data && data.orangeCap && data.orangeCap.length) ? <tr><td colSpan="4" className="muted">No data</td></tr> : null}
                </tbody>
              </table>
            </div>
            <div className="card">
              <h3>Purple cap</h3>
              <table>
                <thead><tr><th>#</th><th>Player</th><th>W</th><th>Runs</th></tr></thead>
                <tbody>
                  {(data && data.purpleCap ? data.purpleCap.slice(0, 12) : []).map(function(p, i) {
                    return <tr key={i}><td>{i + 1}</td><td>{p.name}</td><td>{p.wickets || 0}</td><td>{p.runs || p.bowlRuns || 0}</td></tr>;
                  })}
                  {!(data && data.purpleCap && data.purpleCap.length) ? <tr><td colSpan="4" className="muted">No data</td></tr> : null}
                </tbody>
              </table>
            </div>
          </div>
        ) : null}

        {tab === 'info' ? (
          <div className="card">
            <h3>Match info</h3>
            <div className="kv">
              <div className="item"><div className="k">Teams</div><div className="v">{dual.nameA + ' vs ' + dual.nameB}</div></div>
              <div className="item"><div className="k">Status</div><div className="v">{ended ? ((data && data.matchResult) || 'Completed') : ((data && data.statusText) || 'Live')}</div></div>
              <div className="item"><div className="k">Match</div><div className="v">{meta.name || '-'}</div></div>
              <div className="item"><div className="k">Type</div><div className="v">{meta.type || '-'}</div></div>
              <div className="item"><div className="k">Venue</div><div className="v">{(data && data.venue) || '-'}</div></div>
              <div className="item"><div className="k">Toss</div><div className="v">{(data && (data.tossText || data.toss)) || '-'}</div></div>
              <div className="item"><div className="k">Overs</div><div className="v">{(data && (data.maxOvers || data.totalOvers)) || '-'}</div></div>
              <div className="item"><div className="k">Target</div><div className="v">{(data && (data.target || data.targetScore)) || '-'}</div></div>
            </div>
          </div>
        ) : null}

        {tab === 'players' ? (
          <div className="card">
            <h3>Players</h3>
            <div className="subtabs">
              <button className={scTeam !== 'B' ? 'on' : ''} onClick={function() { setScTeam('A'); }}>{lines.nameA}</button>
              <button className={scTeam === 'B' ? 'on' : ''} onClick={function() { setScTeam('B'); }}>{lines.nameB}</button>
            </div>
            <table>
              <thead><tr><th>#</th><th>Player</th></tr></thead>
              <tbody>
                {(scTeam === 'B' ? lines.batB : lines.batA).map(function(p, i) {
                  return <tr key={i}><td>{i + 1}</td><td>{typeof p === 'string' ? p : (p.name || '-')}</td></tr>;
                })}
                {!(scTeam === 'B' ? lines.batB : lines.batA).length ? <tr><td colSpan="2" className="muted">No squad data yet</td></tr> : null}
              </tbody>
            </table>
          </div>
        ) : null}

        {tab === 'history' ? (
          <div className="card">
            <h3>Match history</h3>
            <table>
              <thead><tr><th>Match</th><th>Result</th><th>When</th></tr></thead>
              <tbody>
                {history.slice(0, 20).map(function(h, i) {
                  return (
                    <tr key={i}>
                      <td>{h.teamA || h.teams || h.name || ('Match ' + (i + 1))}</td>
                      <td>{h.result || h.matchResult || h.summary || '-'}</td>
                      <td>{fmtTime(h.ts || h.endedAt || h.date)}</td>
                    </tr>
                  );
                })}
                {!history.length ? <tr><td colSpan="3" className="muted">No finished matches in payload</td></tr> : null}
              </tbody>
            </table>
          </div>
        ) : null}

        {tab === 'viewers' ? (
          <div className="card">
            <h3>Viewers · last 2 weeks</h3>
            <table>
              <thead><tr><th>Name</th><th>Status</th><th>Log in</th><th>Out</th><th>Activity</th></tr></thead>
              <tbody>
                {viewerRows.map(function(v, i) {
                  const online = !(v.status === 'offline' || v.online === false);
                  return (
                    <tr key={i}>
                      <td>{v.name || v.displayName || 'Viewer'}</td>
                      <td style={{ color: online ? '#22c55e' : '#94a3b8', fontWeight: 800 }}>{online ? 'Online' : 'Offline'}</td>
                      <td>{fmtTime(v.joinedAt || v.firstSeen)}</td>
                      <td>{online ? '-' : fmtTime(v.leftAt || v.lastSeen)}</td>
                      <td>{v.activity || v.tab || 'watching'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        ) : null}
      </div>

      <div className="footer">MySportz React Live</div>
    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl && window.ReactDOM && window.React) {
  ReactDOM.createRoot(rootEl).render(<App />);
} else {
  const e = document.getElementById('error');
  if (e) { e.style.display = 'block'; e.textContent = 'Failed to load React libraries.'; }
}
</script>
</body>
</html>
