<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Live Cricket Score</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Live Score" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1e293b; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .score { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; }
    .overs { font-size: 1rem; opacity: 0.75; margin-top: 2px; }
    .status { font-size: 0.85rem; opacity: 0.8; }
    .chase { background: #7f1d1d; padding: 10px; text-align: center; font-weight: 700; font-size: 1.05rem; animation: pulse 1.2s infinite; }
    .chase.urgent { animation: pulse 0.55s infinite; background: #991b1b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
    .tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
    .tab { flex: 1; padding: 12px 4px; text-align: center; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    .tab.active { background: #334155; color: #38bdf8; }
    .panel { display: none; padding: 14px; height: calc(100vh - 220px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .panel.active { display: block; }
    .chat-input { display: flex; gap: 8px; padding: 10px; background: #1e293b; position: sticky; bottom: 0; }
    .chat-input input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
    .chat-input button { padding: 12px 18px; border-radius: 10px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; }
    .float { position: fixed; font-size: 2.2rem; animation: floatUp 3s forwards; pointer-events: none; z-index: 50; }
    @keyframes floatUp { to { transform: translateY(-140px); opacity: 0; } }
    .anim { position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%); font-size: 4.2rem; font-weight: 900; z-index: 99; animation: pop 1.25s forwards; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
    @keyframes pop { 0%{scale:0.2;opacity:0} 25%{scale:1.25;opacity:1} 100%{scale:1;opacity:0} }
    .ball { display: inline-block; margin: 5px; padding: 8px 12px; background: #334155; border-radius: 8px; font-weight: 600; min-width: 36px; text-align: center; }
    .viewer-row, .coin-row, .chat-row { padding: 8px 0; border-bottom: 1px solid #1e293b; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="score" id="score">0 / 0</div>
      <div class="overs" id="overs">(0.0)</div>
    </div>
    <div class="status" id="status">Connecting…</div>
  </div>

  <div id="chase" class="chase" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-tab="over">This Over</div>
    <div class="tab" data-tab="chat">Chat</div>
    <div class="tab" data-tab="viewers">Viewers</div>
    <div class="tab" data-tab="coins">Gold Coins</div>
  </div>

  <div id="over" class="panel active"></div>
  <div id="chat" class="panel"></div>
  <div id="viewers" class="panel"></div>
  <div id="coins" class="panel"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Type message…" autocomplete="off" />
    <button onclick="sendChat()">Send</button>
  </div>

  <script>
    const MATCH = new URLSearchParams(location.search).get("match") || "default";
    let ws, lastEventKey = null;

    function connect() {
      const name = localStorage.getItem("viewerName") || prompt("Your name") || "Fan";
      localStorage.setItem("viewerName", name);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?match=${MATCH}&name=${encodeURIComponent(name)}&role=viewer`);

      ws.onopen = () => document.getElementById("status").textContent = "● Live";
      ws.onclose = () => {
        document.getElementById("status").textContent = "Reconnecting…";
        setTimeout(connect, 1500 + Math.random() * 2000);
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          handle(msg);
        } catch (_) {}
      };
    }

    function handle(msg) {
      if (msg.type === "full" || msg.type === "update") {
        const d = msg.data;
        document.getElementById("score").textContent = `${d.score.runs} / ${d.score.wickets}`;
        document.getElementById("overs").textContent = `(${d.score.overs})`;

        // This over balls
        const overEl = document.getElementById("over");
        overEl.innerHTML = (d.thisOver || [])
          .map(b => `<span class="ball">${b}</span>`).join("") || "<div style='opacity:.6'>No balls yet</div>";

        // Chase timer
        const chase = document.getElementById("chase");
        if (d.chase) {
          chase.style.display = "block";
          chase.className = "chase" + (d.chase.urgent ? " urgent" : "");
          chase.textContent = `⚡ Need ${d.chase.need} runs in ${d.chase.balls} balls (${d.chase.overs} ov left)`;
        } else {
          chase.style.display = "none";
        }

        // Animation – fire only once per unique event
        if (d.lastEvent) {
          const key = `${d.lastEvent.ts}-${d.lastEvent.event}-${d.lastEvent.runs}`;
          if (key !== lastEventKey && !d.matchEnded) {
            lastEventKey = key;
            playAnim(d.lastEvent);
          }
        }

        // Viewers
        document.getElementById("viewers").innerHTML = (d.viewers || [])
          .map(v => `<div class="viewer-row">${v.name} – online since ${new Date(v.joinedAt).toLocaleTimeString()}</div>`)
          .join("") || "<div style='opacity:.6'>No viewers yet</div>";

        // Gold coins list
        document.getElementById("coins").innerHTML = Object.entries(d.goldCoins || {})
          .map(([u, c]) => `<div class="coin-row">${u}: ${c} 🪙</div>`).join("") || "<div style='opacity:.6'>No coins yet</div>";
      }

      if (msg.type === "chat") {
        const el = document.getElementById("chat");
        el.innerHTML = (msg.data || [])
          .map(c => `<div class="chat-row"><b>${c.name}</b>: ${c.text}</div>`).join("");
        el.scrollTop = el.scrollHeight;
      }

      if (msg.type === "float") {
        const f = document.createElement("div");
        f.className = "float";
        f.textContent = msg.data.emoji;
        f.style.left = Math.random() * 80 + 10 + "%";
        f.style.bottom = "22%";
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 3000);
      }

      if (msg.type === "presence") {
        document.getElementById("viewers").innerHTML = (msg.data || [])
          .map(v => `<div class="viewer-row">${v.name} – online</div>`).join("") || "<div style='opacity:.6'>No viewers yet</div>";
      }
    }

    function playAnim(ev) {
      const el = document.createElement("div");
      el.className = "anim";
      el.textContent = ev.event === "W" ? "WICKET!" : (ev.runs === 4 || ev.runs === 6 ? ev.runs + "!" : String(ev.runs));
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function sendChat() {
      const input = document.getElementById("msg");
      if (!input.value.trim() || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ type: "chat", text: input.value.trim() }));
      input.value = "";
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        document.getElementById(t.dataset.tab).classList.add("active");
      };
    });

    // Enter key for chat
    document.getElementById("msg").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    // Register Service Worker for PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }

    connect();
  </script>
</body>
</html>
