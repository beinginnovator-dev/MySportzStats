:root{--bg:#0b1220;--bg2:#111827;--card:#1a2336;--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#94a3b8;--red:#e11d48;--gold:#fbbf24;--blue:#38bdf8;--accent:#e11d48}

/* Strip skin — score-first horizontal strip arrangement */
body.skin-strip .broadcast{padding:8px 10px}

body.skin-strip .score-grid{margin-top:6px;padding:10px 6px;border-radius:12px;background:rgba(0,0,0,.2);display:grid;grid-template-columns:1fr 72px 1fr;align-items:start;gap:0;overflow:hidden}

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:28px}

body.theme-light .broadcast{background:linear-gradient(180deg,rgba(11,30,75,.93),rgba(10,36,99,.95)),url('https://images.unsplash.com/photo-1531415076815-8dd6c0d1f2f2?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;color:#f8fafc}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;position:relative;z-index:2}

.live-pill i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;position:relative;z-index:2}

.score-panel,.scoreboard-wrap{min-height:210px}

.match-center .title{font-size:19px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);line-height:1.15}

}
.match-header .title{
  font-size:19px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;

}

}

  font-size:12px;font-weight:800;color:#e2e8f0;margin-top:1px;
}
.score-grid{

  margin-top:10px;position:relative;z-index:1;padding:0 2px;
}
.side{text-align:center;min-width:0;min-height:108px;overflow:hidden;padding:0 6px;box-sizing:border-box;width:100%}

}

.side-left .tname{justify-content:flex-start}
.side-right .tname{justify-content:flex-end;flex-direction:row-reverse}
.tname img.wave{animation:flagWave 1.2s ease-in-out infinite;transform-origin:center center}

.score-num{font-size:26px;font-weight:900;line-height:1.05;margin:4px 0 0;color:#fff}
.overs{font-size:12px;color:#cbd5e1;margin-top:1px;font-weight:700}

.match-center{text-align:center;min-width:40px;padding:0 4px}
.match-center .vs-label{font-size:12px;font-weight:900;letter-spacing:.14em;color:#94a3b8}
.match-center .title,.match-center .sub,.match-center .time{display:none!important}

.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:10px;position:relative;z-index:1;padding:0 2px}
.score-num{font-size:27px;font-weight:900;line-height:1.1;margin:6px 0 0;color:#fff}
.tname{font-size:12px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;color:#f8fafc;margin-top:4px}
.result-overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(2,6,23,.55);backdrop-filter:blur(2px)}
.result-overlay .result{width:100%;max-width:360px}
.comm-item .hi{font-weight:900;color:#fbbf24}
.comm-item .hi-w{font-weight:900;color:#fb7185}

.gear{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer}
.settings-backdrop{position:fixed;inset:0;z-index:9998}
.settings-dd{position:fixed;right:12px;top:56px;z-index:9999;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:14px;min-width:240px;max-height:75vh;overflow:auto;padding:8px}
.settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;padding:6px 12px}
.settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#f8fafc;font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer}
.settings-dd button.on,.settings-dd button:hover{background:rgba(56,189,248,.22)}
.settings-dd .sep{height:1px;background:rgba(255,255,255,.12);margin:6px 8px}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:22px;position:relative;z-index:1}
.side{text-align:center;min-width:0;min-height:108px;overflow:hidden;padding:0 6px;box-sizing:border-box;width:100%}
.tname{font-size:12px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;color:#f8fafc}
.tname img{width:24px;height:16px;object-fit:cover;border-radius:3px}
.tname img.wave{animation:flagWave 1.2s ease-in-out infinite;transform-origin:center center}
@keyframes flagWave{0%{transform:translateX(-2px) rotate(-4deg)}50%{transform:translateX(2px) rotate(4deg)}100%{transform:translateX(-2px) rotate(-4deg)}}
.score-num{font-size:27px;font-weight:900;line-height:1.1;margin:4px 0 0;color:#fff}
.overs{font-size:14px;color:#cbd5e1;margin-top:2px;font-weight:700}
.role{font-size:10px;color:var(--blue);font-weight:800;margin-top:2px;text-transform:uppercase}
.match-center{text-align:center}
.match-center .vs-label{font-size:13px;font-weight:900;letter-spacing:.16em;color:#94a3b8}
.crr{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:11px;color:#cbd5e1}
.crr b{color:#fff}
.anim-slot{display:none!important;height:0!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden}
.ev-banner{min-width:150px;padding:14px 22px;border-radius:14px;font-weight:900;font-size:20px;text-align:center;color:#fff;opacity:1;box-shadow:0 12px 32px rgba(0,0,0,.5);letter-spacing:.04em}
.ev-banner.show{animation:evpop 2.6s ease-out forwards;opacity:1!important}
.ev-banner.runs{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.ev-banner.four{background:linear-gradient(135deg,#16a34a,#22c55e)}
.ev-banner.six{background:linear-gradient(135deg,#7c3aed,#a855f7)}

.ev-banner.wicket{background:linear-gradient(135deg,#b91c1c,#ef4444)}
@keyframes evpop{0%{opacity:0;transform:scale(.85)}10%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.result-wrap{position:relative;overflow:hidden;border-radius:14px;margin-top:10px;z-index:2}
.result{padding:14px 12px;background:linear-gradient(135deg,#9a3412,#ea580c 55%,#f59e0b);text-align:center;color:#fff;border-radius:14px;position:relative;z-index:2}
.result .lbl{font-size:10px;font-weight:900;letter-spacing:.14em}
.result .txt{font-size:16px;font-weight:900;margin:4px 0}
.result .sc{font-size:12px;line-height:1.45}

.cracker{position:absolute;inset:0;z-index:1;pointer-events:none}

@keyframes fall{0%{transform:translateY(-12px) rotate(0);opacity:1}100%{transform:translateY(140px) rotate(320deg);opacity:0}}
.fw{position:fixed;inset:0;pointer-events:none;z-index:50}
.fw span{position:absolute;width:6px;height:6px;border-radius:50%;animation:fw 1.2s ease-out forwards}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13px;padding:12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}

.panel{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:900}
.players-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.players-row .bowl-full{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pbox{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
.pbox .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:#475569}
.chip.c0{background:#64748b}.chip.c1{background:#2563eb}.chip.c4{background:#16a34a}.chip.c6{background:#7c3aed}.chip.cw{background:#e11d48}.chip.cx{background:#9333ea}
.comm-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}

.live-stat-name,

}

  font-weight: 600 !important;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* numbers bold */
.score-num,.overs,b,.live-stat-val{font-weight:800}

/* neon sponsor glow */
.sponsor-flash.neon-glow{
  animation: neonPulse 1.2s ease-in-out 3;
  text-shadow:0 0 8px currentColor,0 0 18px currentColor,0 0 28px currentColor;
}
@keyframes neonPulse{
  0%,100%{filter:brightness(1);transform:scale(1)}
  50%{filter:brightness(1.35);transform:scale(1.04)}
}

  function dualTeamScores(d){

    var fiR=d.firstInningsScore!=null?d.firstInningsScore:(d.innings1Score&&d.innings1Score.runs);
    var fiW=d.firstInningsWickets!=null?d.firstInningsWickets:(d.innings1Score&&d.innings1Score.wickets);

  function unwrap(msg){
    if(!msg||typeof msg!=='object')return null;

  function getVoicesSafe(){

  }
  function getMaleVoice(lang){
    lang = lang || 'en';
    var vs = getVoicesSafe();
    var male = /male|david|daniel|mark|james|george|thomas|alex|ravi|guy|ryan|fred|bruce|aaron/i;
    var female = /female|zira|susan|linda|karen|moira|samantha|victoria|fiona|heera|veena|nicky|tessa/i;
    var prefer = vs.filter(function(v){
      var L = (v.lang||'')+' '+(v.name||'');
      if(lang==='hi') return /^hi/i.test(v.lang) || /hindi/i.test(L);
      return /en/i.test(v.lang);
    });
    for(var i=0;i<prefer.length;i++){
      if(male.test(prefer[i].name) && !female.test(prefer[i].name)) return prefer[i];
    }
    for(var j=0;j<vs.length;j++){
      if(male.test(vs[j].name) && !female.test(vs[j].name)) return vs[j];
    }
    for(var k=0;k<prefer.length;k++) return prefer[k];
    return vs[0] || null;
  }
  function getFemaleVoice(lang){

  function speakMale(text, forceLang){

    var u=new SpeechSynthesisUtterance(text);
    u.lang = lang==='hi' ? 'hi-IN' : 'en-IN';
    function go(){
      var v = getPreferredVoice(lang);

      var g = lsGet('react_voice_gender','male');

      else { u.rate = g==='female' ? 1.05 : 1.08; u.pitch = g==='female' ? 1.15 : 0.9; }
      speechSynthesis.speak(u);

    if(getVoicesSafe().length) go();

    if(chip==='3' || lastRuns===3) return {kind:'runs', text:'3 RUNS'};
    if(chip==='2' || lastRuns===2) return {kind:'runs', text:'2 RUNS'};
    if(chip==='1' || lastRuns===1) return {kind:'runs', text:'1 RUN'};
    if(prev){
      if(n(d.wickets)>n(prev.wickets)) return {kind:'wicket', text: 'WICKET · '+wicketTypeFromData(d)};
      var dr = n(d.runs)-n(prev.runs);
      if(dr>=6) return {kind:'six', text:'SIX'};
      if(dr===4 || dr===5) return {kind:'four', text:'FOUR'};
      if(dr===3) return {kind:'runs', text:'3 RUNS'};
      if(dr===2) return {kind:'runs', text:'2 RUNS'};
      if(dr===1) return {kind:'runs', text:'1 RUN'};
      if(dr===0 && n(d.balls)>n(prev.balls)) return {kind:'dot', text:'DOT'};
    }
    return null;
  }

  function computeNrr(d, dual){
    try{
      if(!d) return null;
      var v = d.nrr!=null ? d.nrr : (d.netRunRate!=null ? d.netRunRate : (d.NRR!=null?d.NRR:null));
      if(v!=null && v!=='' && !isNaN(Number(v))) return Number(v);
      // required run rate while chasing
      if(d.rrr!=null && !isNaN(Number(d.rrr))) return Number(d.rrr);
      if(d.requiredRunRate!=null && !isNaN(Number(d.requiredRunRate))) return Number(d.requiredRunRate);
      // rough NRR from both innings if available
      if(dual){
        var aR=Number(dual.aR), aO=Number(dual.aO), bR=Number(dual.bR), bO=Number(dual.bO);
        if(aO>0 && bO>0 && !isNaN(aR) && !isNaN(bR)){
          return (aR/aO) - (bR/bO);
        }
        // chasing: target remaining / overs remaining
        var target = Number(d.target||d.targetScore||0);
        var runs = Number(d.runs||0);
        var overs = Number(d.overs||0);
        var maxO = Number(d.totalOvers||d.maxOvers||d.oversLimit||20);
        if(target>0 && maxO>0){
          var ballsFaced = Math.floor(overs)*6 + Math.round((overs%1)*10);
          var ballsLeft = maxO*6 - ballsFaced;
          if(ballsLeft>0){
            var need = target - runs;
            return (need / ballsLeft) * 6;
          }
        }
      }
      return null;
    }catch(e){ return null; }
  }

                if(Array.isArray(obj.names)) obj.names.forEach(addName);
                if(Array.isArray(obj.list)) obj.list.forEach(addName);
                if(Array.isArray(obj.items)) obj.items.forEach(function(it){ if(it) addName(it.name||it.title); });
                if(typeof obj.name === 'string') addName(obj.name);
              }
            }
            addFrom(data && data.sponsors);
            addFrom(data && data.sponsorNames);
            addFrom(data && data.sponsorList);
            // local cache fallback (same browser / PWA)
            try {
              var cached = JSON.parse(localStorage.getItem('cricket_sponsors_v1')||localStorage.getItem('live_sponsors_cache')||'{}');
              if(cached && cached.enabled !== false) addFrom(cached);
            } catch(e){}
            if(!names.length) return null;
            // If payload disabled and no cache names, hide
            if(data && data.sponsors && data.sponsors.enabled === false && names.length===0) return null;
            var idx = Math.abs(spIdx|0) % names.length;
            var name = names[idx];
            var logo = '';
            try {
              var items = (data && data.sponsors && data.sponsors.items) || [];
              for(var i=0;i<items.length;i++){
                if(items[i] && String(items[i].name||'')===name && items[i].logo){ logo=items[i].logo; break; }
              }
            } catch(e2){}
            var colors=['#fbbf24','#38bdf8','#f472b6','#4ade80','#a78bfa','#fb7185','#f97316'];
            var col=colors[idx % colors.length];
            return h('div',{
              className:'sponsor-flash'+(sponsorNeon?' neon-glow':''),
              key:'sp-'+idx+'-'+name,
              style:{color:col},
              title: name
            },
              logo?h('img',{src:logo,alt:''}):null,
              h('span',null, name+' PRESENTS')
            );
          })(),
          h('div',{className:'title'},title),
          venueLine?h('div',{className:'sub'},venueLine):null,
          h('div',{className:'time'},'Start '+startLabel+' · '+elapsed)
        ),
        h('div',{className:'score-grid'+(scoreGlow==='runs'?' score-glow-runs':scoreGlow==='wkt'?' score-glow-wkt':'')},
          h('div',{className:'side side-left'},
            h('div',{className:'tname'+(celebSide==='A'?' team-celebrate sky-shot':'')},
              h('img',{className:dual.aBat&&!ended?'wave':'',src:FLAG_URL[flags.a]||FLAG_URL.in,alt:''}),
              h('span',null,dual.nameA)
            ),
            h('div',{className:'score-num'+(scoreGlow==='runs'?' score-glow-runs':scoreGlow==='wkt'?' score-glow-wkt':'')+(scoreGlow==='runs'?' score-glow-runs':scoreGlow==='wkt'?' score-glow-wkt':'')},fa.main),
            fa.sub?h('div',{className:'overs'},fa.sub):null,
            h('div',{className:'role'},dual.aBat&&!ended?'Batting':'Bowling')
          ),
          h('div',{className:'match-center'},
            event?h('div',{key:'vsb-'+(event.kind||'')+'-'+String(data&&data.balls),className:'ev-banner show '+evCls,style:{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',zIndex:40,minWidth:110,maxWidth:130}},(event.kind==='wicket'?('WICKET · '+wicketTypeFromData(data)):(event.text||event.kind||'')).toString())
            :h('div',{className:'vs-label',style:{minHeight:28,display:'flex',alignItems:'center',justifyContent:'center'}},'VS')
          ),
          h('div',{className:'side side-right'},
            h('div',{className:'tname'+(celebSide==='B'?' team-celebrate sky-shot-out':'')},
              h('span',null,dual.nameB),
              h('img',{className:dual.bBat&&!ended?'wave':'',src:FLAG_URL[flags.b]||FLAG_URL.au,alt:''})
            ),
            h('div',{className:'score-num'+(scoreGlow==='runs'?' score-glow-runs':scoreGlow==='wkt'?' score-glow-wkt':'')+(scoreGlow==='runs'?' score-glow-runs':scoreGlow==='wkt'?' score-glow-wkt':'')},fb.main),
            fb.sub?h('div',{className:'overs'},fb.sub):null,
            h('div',{className:'role'},dual.bBat&&!ended?'Batting':'Bowling')
          )
        ),

        h('div',{className:'crr'},
          h('span',null,'CRR ',h('b',null,data&&data.crr!=null?Number(data.crr).toFixed(2):'-')),
          h('span',null,'NRR ',h('b',null,(function(){ var n=computeNrr(data,dual); return n!=null?Number(n).toFixed(2):'-'; })()))
        ),
        h('div',{className:'anim-slot','aria-hidden':true}),
        

        ended?h('div',{className:'result-overlay'},
          h('div',{className:'result-wrap',style:{width:'100%',maxWidth:'360px'}},
            h('div',{className:'cracker','aria-hidden':true},
              Array.from({length:22}).map(function(_,i){
                var colors=['#fde68a','#f97316','#fb7185','#a3e635','#38bdf8','#c084fc'];
                return h('i',{key:i,style:{left:(3+i*4.4)+'%',background:colors[i%6],animationDelay:(i*0.07)+'s',width:(6+(i%3)*2)+'px',height:(6+(i%2)*3)+'px'}});
              })
            ),
            h('div',{className:'result'},
              h('div',{className:'lbl'},'MATCH RESULT'),
              h('div',{className:'txt'},(data&&(data.matchResult||data.resultText))||'Match completed'),
              h('div',{className:'sc'},dual.nameA+': '+fa.main+' '+fa.sub,h('br'),dual.nameB+': '+fb.main+' '+fb.sub),
              h('div',{className:'pom'},'Man of the match: '+(pom||(data&&data.strikerName)||'—'))
            )
          )
        ):null
      ),

      h('div',{className:'tabs'},
        tabs.map(function(pair){
          return h('button',{key:pair[0],className:tab===pair[0]?'on':'',onClick:function(){setTab(pair[0]);}},pair[1]);
        })
      ),

      h('div',{className:'panel'},
        tab==='live'?h(React.Fragment,null,
          h('div',{className:'card'},
            h('h3',null,'Batsmen & bowler'),
            h('div',{className:'players-row'},
              h('div',{className:'pbox'},
                h('div',{className:'k'},'Striker'),
                h('div',{className:'v'},(data&&data.strikerName)||'-'),
                h(MiniBatStats,{d:strikerStats})
              ),
              h('div',{className:'pbox'},
                h('div',{className:'k'},'Non-striker'),
                h('div',{className:'v'},(data&&(data.nonStrikerName||data.nonStriker))||'-'),
                h(MiniBatStats,{d:nonStats})
              ),
              h('div',{className:'pbox bowl-full'},
                h('div',{className:'k'},'Bowler'),
                h('div',{className:'v'},(data&&data.bowlerName)||'-'),
                h(MiniBowlStats,{d:bowlStats})
              )
            )
          ),
          h('div',{className:'card'},
            h('h3',null,'This over'),
            h('div',{className:'chips'},
              (balls||[]).map(function(b,i){
                var lab=typeof b==='object'?(b.label||''):String(b==null?'':b);
                return h('span',{key:i,className:chipClass(lab)},lab||'•');
              }),
              !(balls&&balls.length)?h('span',{className:'muted'},'No balls yet'):null
            )
          )
        ):null,

        tab==='scorecard'?h('div',{className:'card'},
          h('div',{className:'subtabs'},
            h('button',{className:scTeam==='A'?'on':'',onClick:function(){setScTeam('A');}},lines.nameA),
            h('button',{className:scTeam==='B'?'on':'',onClick:function(){setScTeam('B');}},lines.nameB)
          ),
          h('h3',null,'Batting'),
          (function(){
            var list=scTeam==='B'?lines.batB.slice():lines.batA.slice();
            var squad=scTeam==='B'?((data&&data.squadB)||[]):((data&&data.squadA)||[]);
            var seen={};
            list.forEach(function(p){if(p&&p.name)seen[String(p.name).toLowerCase()]=1;});
            (squad||[]).forEach(function(p){
              var name=typeof p==='string'?p:(p.name||'');
              if(name&&!seen[name.toLowerCase()]){
                list.push({name:name,runs:0,balls:0,fours:0,sixes:0,isOut:false,yetToBat:true});
              }
            });
            if(!list.length)return h('div',{className:'muted'},'Yet to bat');
            return h('table',null,
              h('thead',null,h('tr',null,h('th',null,'Batter'),h('th',null,'R'),h('th',null,'B'),h('th',null,'4s'),h('th',null,'6s'),h('th',null,'SR'))),
              h('tbody',null,list.map(function(p,i){
                if(p.yetToBat) return h('tr',{key:i},h('td',null,p.name),h('td',{colSpan:5,className:'muted'},'yet to bat'));
                return h('tr',{key:i},h('td',null,(p.name||'-')+(p.isOut?'':' *')),h('td',null,n(p.runs)),h('td',null,n(p.balls)),h('td',null,n(p.fours)),h('td',null,n(p.sixes)),h('td',null,sr(p.runs,p.balls)));
              }))
            );
          })(),
          h('h3',{style:{marginTop:14}},'Bowling'),
          (function(){
            var list=scTeam==='B'?lines.bowlB:lines.bowlA;
            if(!list.length)return h('div',{className:'muted'},'Yet to bowl');
            return h('table',null,
              h('thead',null,h('tr',null,h('th',null,'Bowler'),h('th',null,'O'),h('th',null,'R'),h('th',null,'W'),h('th',null,'Econ'))),
              h('tbody',null,list.map(function(p,i){
                var bb=p.bowlBalls!=null?n(p.bowlBalls):n(p.balls);
                var rr=p.bowlRuns!=null?n(p.bowlRuns):n(p.runs);
                return h('tr',{key:i},h('td',null,p.name||'-'),h('td',null,oversFromBalls(bb)),h('td',null,rr),h('td',null,n(p.wickets)),h('td',null,econ(rr,bb)));
              }))
            );
          })()
        ):null,

        tab==='commentary'?h('div',{className:'card'},
          h('div',{className:'row'},
            h('button',{className:'btn'+(ttsOn?' on':''),onClick:function(){
              var next=!ttsOn;setTtsOn(next);lsSet('cricket_tts_on',next?'1':'0');if(next)try{ var u=excitingLine({strikerName:'Batter',bowlerName:'Bowler',runs:10,wickets:0,overs:'1.0'}, {kind:'four'}); speakTts({strikerName:'Batter',bowlerName:'Bowler',runs:10,wickets:0,overs:'1.0',balls:6},{kind:'four'}); }catch(e){speakMale('Commentary on');}
            }},'Voice '+(ttsOn?('ON · '+(lsGet('react_voice_gender','male')==='female'?'Female':'Male')):'OFF')),
            h('button',{className:'btn',onClick:function(){
              var g=lsGet('react_voice_gender','male')==='female'?'male':'female';
              lsSet('react_voice_gender', g);
              setTtsOn(true); lsSet('react_tts_on','1'); lsSet('cricket_tts_on','1');
              try{ force(); }catch(e){}
              var lang=lsGet('react_comm_lang','en');
              if(lang==='hi') speakMale(g==='female'?'यह महिला आवाज़ है। चार रन!':'यह पुरुष आवाज़ है। चार रन!','hi');
              else speakMale(g==='female'?'Female commentary voice. Four runs!':'Male commentary voice. Four runs!','en');
            }},'Male / Female'),
            h('button',{className:'btn',onClick:function(){
              var lang=lsGet('react_comm_lang','en');
              if(lang==='hi') speakMale('शानदार चौका! बल्लेबाज ने चार रन बनाए।','hi');
              else speakMale('Four runs! Brilliant timing into the gap.');
            }},'Test voice')
          ),
          (function(){
            var lang=commLang||lsGet('react_comm_lang','en');
            var items=buildOverSummaries(data).reverse().slice(0,60);
            if(!items.length) return h('div',{className:'muted'}, lang==='hi' ? 'अभी कोई कमेंट्री नहीं' : 'No commentary yet');
            return items.map(function(it,i){
              if(it.type==='sum') {
                var st=it.text;
                if(lang==='hi') st=toHindiComm(st);
                return h('div',{className:'comm-over-sum',key:'s'+i}, st);
              }
              return renderCommLine(it.text,i,lang);
            });
          })(),
          !(data&&data.commentary&&data.commentary.length)?h('div',{className:'muted'},'No commentary yet'):null
        ):null,

        tab==='fow'?h('div',{className:'card'},
          h('h3',null,'Fall of wickets'),
          h('table',null,
            h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Score'),h('th',null,'Batter'),h('th',null,'R(B)'),h('th',null,'Bowler'),h('th',null,'Dismissal'))),
            h('tbody',null,
              (data&&data.fallOfWickets?data.fallOfWickets:[]).map(function(w,i){
                var pr=w.personalRuns!=null?w.personalRuns:(w.runs!=null?w.runs:'-');
                var pb=w.personalBalls!=null?w.personalBalls:(w.balls!=null?w.balls:'-');
                return h('tr',{key:i},
                  h('td',null,i+1),
                  h('td',null,w.score!=null?w.score:'-'),
                  h('td',null,w.batsman||w.player||w.name||'-'),
                  h('td',null, pr+'('+pb+')'),
                  h('td',null,w.bowler||w.bowlerName||'-'),
                  h('td',null,w.dismissal||w.howOut||'-')
                );
              }),
              !(data&&data.fallOfWickets&&data.fallOfWickets.length)?h('tr',null,h('td',{colSpan:6,className:'muted'},'No wickets yet')):null
            )
          )
        ):null,

        tab==='caps'?h('div',{className:'card'},
          h('div',{className:'subtabs'},
            h('button',{className:capSub==='orange'?'on':'',onClick:function(){setCapSub('orange');}},'Orange Cap'),
            h('button',{className:capSub==='purple'?'on':'',onClick:function(){setCapSub('purple');}},'Purple Cap')
          ),
          capSub==='orange'?h('table',null,
            h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Player'),h('th',null,'Runs'),h('th',null,'Balls'),h('th',null,'Avg'),h('th',null,'SR'))),
            h('tbody',null,
              (data&&data.orangeCap?data.orangeCap.slice(0,20):[]).map(function(p,i){
                return h('tr',{key:i},
                  h('td',null,i+1),h('td',null,p.name),h('td',null,p.runs||0),h('td',null,p.balls||0),
                  h('td',null,p.avg!=null?p.avg:(p.average!=null?p.average:'-')),
                  h('td',null,p.sr!=null?p.sr:sr(p.runs,p.balls))
                );
              }),
              !(data&&data.orangeCap&&data.orangeCap.length)?h('tr',null,h('td',{colSpan:6,className:'muted'},'No data')):null
            )
          ):h('table',null,
            h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Player'),h('th',null,'W'),h('th',null,'Runs'),h('th',null,'Overs'),h('th',null,'Econ'))),
            h('tbody',null,
              (data&&data.purpleCap?data.purpleCap.slice(0,20):[]).map(function(p,i){
                var bb=p.bowlBalls!=null?n(p.bowlBalls):n(p.balls);
                var rr=p.bowlRuns!=null?n(p.bowlRuns):n(p.runs);
                return h('tr',{key:i},
                  h('td',null,i+1),h('td',null,p.name),h('td',null,p.wickets||0),h('td',null,rr),
                  h('td',null,oversFromBalls(bb)),h('td',null,econ(rr,bb))
                );
              }),
              !(data&&data.purpleCap&&data.purpleCap.length)?h('tr',null,h('td',{colSpan:6,className:'muted'},'No data')):null
            )
          )
        ):null,

        tab==='info'?h('div',{className:'card'},
          h('h3',null,'Match info'),
          h('div',{className:'kv'},
            h('div',{className:'item'},h('div',{className:'k'},'Teams'),h('div',{className:'v'},dual.nameA+' vs '+dual.nameB)),
            h('div',{className:'item'},h('div',{className:'k'},'Status'),h('div',{className:'v'},ended?((data&&data.matchResult)||'Completed'):((data&&data.statusText)||'Live'))),
            h('div',{className:'item'},h('div',{className:'k'},'Match'),h('div',{className:'v'},meta.name||'-')),
            h('div',{className:'item'},h('div',{className:'k'},'Type'),h('div',{className:'v'},meta.type||'-')),
            h('div',{className:'item'},h('div',{className:'k'},'Venue'),h('div',{className:'v'},meta.venue||'-')),
            h('div',{className:'item'},h('div',{className:'k'},'Toss'),h('div',{className:'v'},(data&&(data.tossText||data.toss))||'-')),
            h('div',{className:'item'},h('div',{className:'k'},'Overs'),h('div',{className:'v'},(data&&(data.maxOvers||data.totalOvers))||'-')),
            h('div',{className:'item'},h('div',{className:'k'},'Target'),h('div',{className:'v'},(data&&(data.target||data.targetScore))||'-'))
          )
        ):null,

        tab==='players'?h('div',{className:'card'},
          h('h3',null,'Squad'),
          h('div',{className:'subtabs'},
            h('button',{className:scTeam!=='B'?'on':'',onClick:function(){setScTeam('A');}},lines.nameA),
            h('button',{className:scTeam==='B'?'on':'',onClick:function(){setScTeam('B');}},lines.nameB)
          ),
          (function(){
            var list=[];
            if(scTeam==='B'){
              list=(data&&data.squadB&&data.squadB.length)?data.squadB:(data&&data.teamBPlayers)||lines.batB||[];
            }else{
              list=(data&&data.squadA&&data.squadA.length)?data.squadA:(data&&data.teamAPlayers)||lines.batA||[];
            }
            if(!list.length)return h('div',{className:'muted'},'No squad data from scorer yet');
            return h('table',null,
              h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Player'),h('th',null,'R'),h('th',null,'B'),h('th',null,''))),
              h('tbody',null,list.map(function(p,i){
                var name=typeof p==='string'?p:(p.name||'-');
                var runs=typeof p==='object'?n(p.runs):0;
                var balls=typeof p==='object'?n(p.balls):0;
                var out=typeof p==='object'&&p.isOut?'out':'';
                return h('tr',{key:i},h('td',null,i+1),h('td',null,name),h('td',null,runs),h('td',null,balls),h('td',null,out));
              }))
            );
          })()
        ):null,

        tab==='history'?h('div',{className:'card'},
          h('h3',null,'Match history'),
          h('table',null,
            h('thead',null,h('tr',null,h('th',null,'Match'),h('th',null,'Result'),h('th',null,'When'))),
            h('tbody',null,
              history.slice(0,20).map(function(item,i){
                return h('tr',{key:i},
                  h('td',null,histLabel(item)),
                  h('td',null,histResult(item)),
                  h('td',null,histWhen(item))
                );
              }),
              !history.length?h('tr',null,h('td',{colSpan:3,className:'muted'},'No finished matches in payload')):null
            )
          )
        ):null,

        tab==='viewers'?h('div',{className:'card'},
          h('h3',null,'Viewers · last 2 weeks'),
          h('table',null,
            h('thead',null,h('tr',null,h('th',null,'Name'),h('th',null,'Status'),h('th',null,'Log in'),h('th',null,'Out'),h('th',null,'Activity'))),
            h('tbody',null,
              viewerRows.map(function(v,i){
                var online=!(v.status==='offline'||v.online===false);
                return h('tr',{key:i},
                  h('td',null,v.name||v.displayName||'Viewer'),
                  h('td',{style:{color:online?'#22c55e':'#94a3b8',fontWeight:800}},online?'Online':'Offline'),
                  h('td',null,fmtTime(v.joinedAt||v.firstSeen)),
                  h('td',null,online?'-':fmtTime(v.leftAt||v.lastSeen)),
                  h('td',null,v.activity||v.tab||'watching')
                );
              })
            )
          )
        ):null
      ),

      h('div',{className:'footer'},'MySportz React Live')
    );
  }

  try{
    document.addEventListener('click', function once(){
      document.removeEventListener('click', once);
      try{ stadPlaySample('whistle', 0.01, 1); }catch(e){}
    }, {once:true});
  }catch(e){}
  var rootEl=document.getElementById('root');
  if(rootEl){
    if(ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(h(App));
    else ReactDOM.render(h(App), rootEl);
  }
})();
</script>
