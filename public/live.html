<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MySportz Live · International</title>
<meta name="theme-color" content="#0b1220"/>
<style>
  :root{
    --bg:#0b1220; --bg2:#111827; --card:#1a2336;
    --line:rgba(255,255,255,.08); --text:#f8fafc; --muted:#94a3b8;
    --red:#e11d48; --gold:#fbbf24; --blue:#38bdf8; --accent:#e11d48;
  }
  body.theme-light{
    --bg:#e8eef5; --bg2:#fff; --card:#fff;
    --line:rgba(15,23,42,.1); --text:#0f172a; --muted:#64748b;
    --accent:#0f766e; --blue:#0284c7;
  }
  body.theme-ipl{
    --bg:#0c0a1a; --bg2:#16132a; --card:#221c40;
    --line:rgba(255,255,255,.1); --text:#f8fafc; --muted:#a5b4fc;
    --accent:#7c3aed; --blue:#a78bfa;
  }
  body.theme-icc{
    --bg:#071a14; --bg2:#0c241c; --card:#134032;
    --line:rgba(255,255,255,.1); --text:#ecfdf5; --muted:#6ee7b7;
    --accent:#059669; --blue:#34d399;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  a{color:var(--blue)}
  .app{max-width:480px;margin:0 auto;padding-bottom:28px}
  .broadcast{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line);padding:16px 14px 20px;position:relative;min-height:220px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  .live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(225,29,72,.15);border:1px solid rgba(225,29,72,.45);color:#fecdd3;font-size:11px;font-weight:900;padding:4px 8px;border-radius:999px}
  body.theme-light .live-pill{color:#9f1239}
  .live-pill i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(225,29,72,0);opacity:.7}}
  .match-meta{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
  .match-meta b{color:var(--gold);display:block;font-size:12px;letter-spacing:.12em}
  .gear{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px}
  .settings-backdrop{position:fixed;inset:0;z-index:9998}
  .settings-dd{position:fixed;right:12px;top:56px;z-index:9999;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:14px;min-width:240px;max-height:min(75vh,480px);overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:8px}
  body.theme-light .settings-dd{background:#fff;border-color:#cbd5e1}
  .settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;padding:6px 12px 4px}
  .settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#f8fafc!important;font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer}
  body.theme-light .settings-dd button{color:#0f172a!important}
  .settings-dd button.on,.settings-dd button:hover{background:rgba(56,189,248,.22)}
  .settings-dd .sep{height:1px;background:rgba(255,255,255,.12);margin:6px 8px}

  .score-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;position:relative;padding:8px 0 6px;min-height:120px}
  .side{text-align:center;min-width:0}
  .tname{font-size:11px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
  .tname img{width:22px;height:16px;object-fit:cover;border-radius:3px}
  .score-num{font-size:34px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;margin:6px 0 2px}
  .score-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
  .overs{font-size:15px;color:var(--muted);margin-top:4px;font-weight:700}
  .role{font-size:10px;color:var(--blue);font-weight:800;margin-top:2px;text-transform:uppercase}
  .vs{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.14em;position:relative;z-index:5}
  .crr{display:flex;justify-content:center;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
  .crr b{color:var(--text)}
  .ev-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;min-width:110px;padding:12px 16px;border-radius:14px;font-weight:900;font-size:16px;text-align:center;color:#fff;opacity:0;pointer-events:none}
  .ev-banner.show{animation:evpop 2.8s ease-out forwards}
  .ev-banner.runs{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .ev-banner.four{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .ev-banner.six{background:linear-gradient(135deg,#7c3aed,#a855f7)}
  .ev-banner.dot{background:linear-gradient(135deg,#475569,#64748b)}
  .ev-banner.extra{background:linear-gradient(135deg,#6d28d9,#a855f7)}
  .ev-banner.wicket{background:linear-gradient(135deg,#b91c1c,#ef4444)}
  @keyframes evpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}100%{opacity:0}}
  .result{margin-top:10px;border-radius:12px;padding:12px;background:linear-gradient(135deg,#9a3412,#ea580c 60%,#f59e0b);text-align:center;color:#fff}
  .result .lbl{font-size:10px;font-weight:900;letter-spacing:.14em}
  .result .txt{font-size:16px;font-weight:900;margin:4px 0}
  .result .sc{font-size:12px;line-height:1.45}
  .result .pom{margin-top:6px;font-size:12px;font-weight:800;color:#fef3c7}

  .tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:11px;padding:12px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .panel{padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pbox{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
  .pbox .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .pbox .v{font-size:14px;font-weight:800;margin-top:2px}
  .pbox .s{font-size:12px;color:var(--blue);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{min-width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;background:#475569}
  .chip.c0{background:#64748b}.chip.c1{background:#2563eb}.chip.c4{background:#16a34a}.chip.c6{background:#7c3aed}.chip.cw{background:#e11d48}.chip.cx{background:#9333ea}
  .comm-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:8px 6px;border-bottom:1px solid var(--line)}
  .subtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .subtabs button{flex:1;min-width:40%;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px;font-weight:800;font-size:12px;cursor:pointer}
  .subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{border:1px solid var(--line);background:rgba(127,127,127,.06);color:var(--text);border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv .item{background:rgba(127,127,127,.06);border:1px solid var(--line);border-radius:12px;padding:10px}
  .kv .item .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .kv .item .v{font-size:14px;font-weight:800;margin-top:4px}
  .welcome{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:16px}
  .welcome .box{width:min(400px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
  .footer{text-align:center;padding:14px;font-size:11px;color:var(--muted)}
  .muted{color:var(--muted)}
</style>
</head>
<body class="theme-dark">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const FLAG_POOL=['in','au','eng','nz','za','pk','bd','sl','af','ie','wi','np','nl','zw','sc'];
const FLAG_URL={
  in:'https://flagcdn.com/w40/in.png',au:'https://flagcdn.com/w40/au.png',eng:'https://flagcdn.com/w40/gb-eng.png',
  nz:'https://flagcdn.com/w40/nz.png',za:'https://flagcdn.com/w40/za.png',pk:'https://flagcdn.com/w40/pk.png',
  bd:'https://flagcdn.com/w40/bd.png',sl:'https://flagcdn.com/w40/lk.png',af:'https://flagcdn.com/w40/af.png',
  ie:'https://flagcdn.com/w40/ie.png',wi:'https://flagcdn.com/w40/jm.png',np:'https://flagcdn.com/w40/np.png',
  nl:'https://flagcdn.com/w40/nl.png',zw:'https://flagcdn.com/w40/zw.png',sc:'https://flagcdn.com/w40/gb-sct.png'
};
function hashStr(s){s=String(s||'');let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h)}
function flagsForMatch(d){
  const key=String((d&&d.matchId)||'')+'|'+(d?.teamA||d?.teamAName||'A')+'|'+(d?.teamB||d?.teamBName||'B');
  try{
    const k='react_flags_'+key; const c=localStorage.getItem(k); if(c){const p=JSON.parse(c);if(p?.a&&p?.b)return p}
    let ia=hashStr(key)%FLAG_POOL.length, ib=(ia+3+hashStr(key+'b'))%FLAG_POOL.length;
    if(ib===ia)ib=(ib+1)%FLAG_POOL.length;
    const out={a:FLAG_POOL[ia],b:FLAG_POOL[ib]}; localStorage.setItem(k,JSON.stringify(out)); return out;
  }catch(e){return {a:'in',b:'au'}}
}

/** International score formats */
function formatScore(runs, wkts, overs, fmt){
  const r = runs==null ? '—' : runs;
  const w = wkts==null ? '—' : wkts;
  const o = (overs==null||overs==='') ? '—' : overs;
  if (r==='—' && String(runs).toLowerCase().includes('yet')) return {main:'Yet to bat', sub:''};
  switch(fmt){
    case 'cricinfo': // 115 for 5 in 8.0 overs
      return {main: `${r} for ${w}`, sub: `in ${o} overs`};
    case 'broadcast': // 115-5  (8.0)
      return {main: `${r}-${w}`, sub: `(${o})`};
    case 'compact': // 115/5
      return {main: `${r}/${w}`, sub: o!=='—' ? `Ov ${o}` : ''};
    case 'split': // runs big, wkts small feel via sub
      return {main: String(r), sub: `${w} wkts · ${o} ov`};
    default: // classic 115/5 (8.0)
      return {main: `${r}/${w}`, sub: `(${o})`};
  }
}

function unwrap(msg){
  if(!msg||typeof msg!=='object')return null;
  if(msg.data&&typeof msg.data==='object'&&(msg.data.runs!=null||msg.data.teamA||msg.data.balls!=null))return msg.data;
  return msg;
}
function useLiveMatch(){
  const [data,setData]=useState(null);
  const [viewers,setViewers]=useState([]);
  const [connected,setConnected]=useState(false);
  const lastSig=useRef(''); const wsRef=useRef(null);
  const apply=useCallback((raw)=>{
    const d=unwrap(raw); if(!d)return;
    const chip=(d.thisOver&&d.thisOver.balls)?d.thisOver.balls.join(','):(Array.isArray(d.currentOverBalls)?d.currentOverBalls.map(c=>c&&c.label!=null?c.label:c).join(','):'');
    const sig=[d.balls,d.runs,d.wickets,d.ts,chip,(d.commentary||[]).slice(-1)[0], (d.matchHistory||[]).length].join('|');
    if(sig===lastSig.current)return; lastSig.current=sig; setData(d);
    if(Array.isArray(d.viewers)) setViewers(d.viewers);
  },[]);
  useEffect(()=>{
    const match=new URLSearchParams(location.search).get('match')||'current';
    let dead=false,retry=0,pollTimer;
    function connect(){
      if(dead)return;
      try{
        const proto=location.protocol==='https:'?'wss:':'ws:';
        const ws=new WebSocket(proto+'//'+location.host+'/ws?match='+encodeURIComponent(match)+'&name=ReactFan');
        wsRef.current=ws;
        ws.onopen=()=>{setConnected(true);retry=0};
        ws.onmessage=(ev)=>{try{const msg=JSON.parse(ev.data);if(!msg||msg.type==='pong')return;
          if(msg.type==='presence'){setViewers(Array.isArray(msg.data)?msg.data:[]);return}
          if(msg.type==='full'||msg.type==='update'||msg.type==='score'||msg.runs!=null)apply(msg.data||msg);
        }catch(e){}};
        ws.onclose=()=>{setConnected(false);setTimeout(connect,Math.min(15000,800+retry++*700))};
      }catch(e){}
    }
    connect();
    async function poll(){
      if(wsRef.current&&wsRef.current.readyState===1)return;
      try{const r=await fetch('/api/live-public?match='+encodeURIComponent(match)+'&_='+Date.now(),{cache:'no-store'}); if(r.ok)apply(await r.json())}catch(e){}
    }
    pollTimer=setInterval(poll,5000);poll();
    return ()=>{dead=true;clearInterval(pollTimer);try{wsRef.current&&wsRef.current.close()}catch(e){}};
  },[apply]);
  return {data,viewers,connected};
}

function getMaleVoice(){
  const voices=speechSynthesis.getVoices()||[];
  const male=/male|man|david|daniel|mark|james|george|thomas|fred|alex|ravi|microsoft (david|mark|guy|ryan)/i;
  const female=/female|woman|zira|susan|linda|karen|moira|samantha|victoria|fiona/i;
  return voices.find(x=>male.test(x.name)&&!female.test(x.name)&&/en/i.test(x.lang||''))
    || voices.find(x=>/en/i.test(x.lang||'')&&!female.test(x.name)) || null;
}
function speakMale(text){
  if(!window.speechSynthesis)return;
  text=String(text||'').replace(/[*＊]/g,' ').trim(); if(!text)return;
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text); const v=getMaleVoice(); if(v)u.voice=v;
  u.pitch=0.85;u.rate=1.1; speechSynthesis.speak(u);
}
function detectEvent(d,prev){
  if(!d)return null;
  const chipArr=(d.thisOver&&d.thisOver.balls)||d.currentOverBalls||[];
  let chip=''; if(chipArr.length){const last=chipArr[chipArr.length-1];chip=String(typeof last==='object'?(last.label||''):last).toUpperCase()}
  const ev=String(d.lastEvent||'').toLowerCase();
  if(chip==='W'||(chip[0]==='W'&&!chip.includes('WD'))||ev==='wicket') return {kind:'wicket',text:'WICKET'};
  if(chip==='6'||ev==='six') return {kind:'six',text:'SIX'};
  if(chip==='4'||ev==='four') return {kind:'four',text:'FOUR'};
  if(/WD/.test(chip)||ev==='wide') return {kind:'extra',text:'WIDE'};
  if(/NB/.test(chip)) return {kind:'extra',text:'NO BALL'};
  if(/LB/.test(chip)) return {kind:'extra',text:'LEG BYE'};
  if(chip==='0'||chip==='•') return {kind:'dot',text:'DOT'};
  if(chip==='3') return {kind:'runs',text:'3 RUNS'};
  if(chip==='2') return {kind:'runs',text:'2 RUNS'};
  if(chip==='1') return {kind:'runs',text:'1 RUN'};
  if(prev&&(d.wickets|0)>(prev.wickets|0)) return {kind:'wicket',text:'WICKET'};
  return null;
}
function chipClass(lab){lab=String(lab||'').toUpperCase();
  if(lab==='4')return 'chip c4'; if(lab==='6')return 'chip c6';
  if(lab==='W'||(lab[0]==='W'&&!lab.includes('WD')))return 'chip cw';
  if(/WD|NB|LB/.test(lab))return 'chip cx'; if(lab==='0'||lab==='•')return 'chip c0'; return 'chip c1'}
function fmtTime(ts){if(!ts)return '—';try{return new Date(ts).toLocaleString()}catch(e){return '—'}}
function teamLines(d){
  if(!d) return {batA:[],bowlA:[],batB:[],bowlB:[],nameA:'Team A',nameB:'Team B',batting:'A'};
  const first=String(d.firstBattingTeam||'A').toUpperCase()==='B'?'B':'A';
  const i1b=d.innings1Batters||[],i1o=d.innings1Bowlers||[],i2b=d.innings2Batters||[],i2o=d.innings2Bowlers||[];
  const nameA=d.teamA||d.teamAName||'Team A', nameB=d.teamB||d.teamBName||'Team B';
  const batA=first==='A'?i1b:i2b, batB=first==='B'?i1b:i2b;
  const bowlA=first==='A'?i2o:i1o, bowlB=first==='B'?i2o:i1o;
  let batting='A';
  if(d.battingTeam==='B'||d.battingTeam===nameB) batting='B';
  else if((d.currentInnings|0)>=2) batting=first==='A'?'B':'A';
  else batting=first;
  return {batA,bowlA,batB,bowlB,nameA,nameB,batting};
}
function playersList(d){
  // squad / players from scorer payload
  const a=d?.teamASquad||d?.squadA||d?.playersA||[];
  const b=d?.teamBSquad||d?.squadB||d?.playersB||[];
  const fromBat=()=>{
    const L=teamLines(d);
    const names=new Set();
    [...(L.batA||[]),...(L.batB||[]),...(L.bowlA||[]),...(L.bowlB||[])].forEach(p=>{if(p&&p.name)names.add(p.name)});
    return [...names];
  };
  return {a:Array.isArray(a)&&a.length?a:fromBat().slice(0,11), b:Array.isArray(b)&&b.length?b:[] , flat: fromBat()};
}

function Welcome({data,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,10000);return ()=>clearTimeout(t)},[onDone]);
  const ta=data?.teamA||data?.teamAName||'Team A', tb=data?.teamB||data?.teamBName||'Team B';
  const runs=data?.runs??'—',wk=data?.wickets??'—',ov=data?.overs||'—';
  return (
    <div className="welcome" onClick={onDone}>
      <div className="box">
        <div style={{fontSize:11,fontWeight:900,letterSpacing:'.14em',color:'var(--red)'}}>LIVE CRICKET</div>
        <div style={{fontSize:18,fontWeight:900,margin:'8px 0'}}>{ta} vs {tb}</div>
        <div className="muted">{data?.matchEnded?(data.matchResult||'Match completed'):(data?.runs!=null?`Live · ${runs}/${wk} (${ov})`:'Waiting for scoring')}</div>
        <div style={{fontSize:26,fontWeight:900,margin:'10px 0'}}>{runs}/{wk} <span style={{fontSize:14}}>({ov})</span></div>
      </div>
    </div>
  );
}

function Scoreboard({data,viewers,connected,event,scoreFmt,settingsOpen,setSettingsOpen,theme,setTheme,ttsOn,setTtsOn,scoreFmtSet}){
  const ta=data?.teamA||data?.teamAName||'Team A';
  const tb=data?.teamB||data?.teamBName||'Team B';
  const flags=flagsForMatch(data||{});
  const inns=data?.innings||1;
  const aRuns=data?.teamARuns!=null?data.teamARuns:(inns===1?data?.runs:null);
  const aWk=data?.teamAWickets!=null?data.teamAWickets:(inns===1?data?.wickets:null);
  const aOv=data?.teamAOvers||(inns===1?(data?.overs||'0.0'):null);
  const bRuns=data?.teamBRuns!=null?data.teamBRuns:(inns===2?data?.runs:null);
  const bWk=data?.teamBWickets!=null?data.teamBWickets:(inns===2?data?.wickets:null);
  const bOv=data?.teamBOvers||(inns===2?(data?.overs||'0.0'):null);
  const fa=aRuns==null?{main:'Yet to bat',sub:''}:formatScore(aRuns,aWk,aOv,scoreFmt);
  const fb=bRuns==null?{main:'Yet to bat',sub:''}:formatScore(bRuns,bWk,bOv,scoreFmt);
  const aBat=inns===1||data?.battingTeam==='A'||data?.battingTeam===ta;
  const bBat=inns===2||data?.battingTeam==='B'||data?.battingTeam===tb;
  const ended=!!(data?.matchEnded||data?.matchResult);
  const pom=data?.playerOfMatch||data?.pom||data?.manOfMatch;
  const evCls=event?(event.kind==='wicket'?'wicket':event.kind==='six'?'six':event.kind==='four'?'four':event.kind==='dot'?'dot':event.kind==='extra'?'extra':'runs'):'';

  return (
    <div className="broadcast">
      <div className="bar">
        <span className="live-pill"><i></i>LIVE · {viewers?.length||0}</span>
        <div className="match-meta"><b>MATCH</b><span>{connected?'Connected':'Reconnecting…'}</span></div>
        <button className="gear" type="button" onClick={()=>setSettingsOpen(v=>!v)}>⚙</button>
      </div>
      {settingsOpen && (
        <>
          <div className="settings-backdrop" onClick={()=>setSettingsOpen(false)}></div>
          <div className="settings-dd" onClick={e=>e.stopPropagation()}>
            <div className="dd-title">Sound</div>
            <button type="button" className={ttsOn?'on':''} onClick={()=>{const n=!ttsOn;setTtsOn(n);localStorage.setItem('cricket_tts_on',n?'1':'0');if(n)speakMale('Male commentary on')}}>{ttsOn?'🔊 Sound ON (Male)':'🔇 Sound OFF'}</button>
            <div className="sep"></div>
            <div className="dd-title">Themes</div>
            {[['dark','Broadcast Dark'],['light','Light Pro'],['ipl','IPL Night'],['icc','ICC Green']].map(([id,label])=>(
              <button key={id} type="button" className={theme===id?'on':''} onClick={()=>{setTheme(id);localStorage.setItem('react_live_theme',id)}}>{label}</button>
            ))}
            <div className="sep"></div>
            <div className="dd-title">Score format</div>
            {[['classic','Classic 115/5 (8.0)'],['cricinfo','Cricinfo 115 for 5'],['broadcast','Broadcast 115-5'],['compact','Compact 115/5'],['split','Split runs / wkts']].map(([id,label])=>(
              <button key={id} type="button" className={scoreFmt===id?'on':''} onClick={()=>{scoreFmtSet(id);localStorage.setItem('react_score_fmt',id)}}>{label}</button>
            ))}
            <div className="sep"></div>
            <button type="button" onClick={()=>{location.href='/live.html'}}>Open vanilla live</button>
          </div>
        </>
      )}
      <div className="score-grid">
        <div className="side">
          <div className="tname"><img src={FLAG_URL[flags.a]||FLAG_URL.in} alt=""/><span>{ta}</span></div>
          <div className="score-num">{fa.main}</div>
          {fa.sub ? <div className="overs">{fa.sub}</div> : null}
          <div className="role">{aBat&&!ended?'Batting':'Bowling'}</div>
        </div>
        <div className="vs">VS{event&&<div className={'ev-banner show '+evCls}>{event.text}</div>}</div>
        <div className="side">
          <div className="tname"><span>{tb}</span><img src={FLAG_URL[flags.b]||FLAG_URL.au} alt=""/></div>
          <div className="score-num">{fb.main}</div>
          {fb.sub ? <div className="overs">{fb.sub}</div> : null}
          <div className="role">{bBat&&!ended?'Batting':'Bowling'}</div>
        </div>
      </div>
      <div className="crr">
        <span>CRR <b>{data?.crr!=null?Number(data.crr).toFixed(2):'—'}</b></span>
        <span>RRR <b>{data?.nrr!=null?Number(data.nrr).toFixed(2):(data?.rrr!=null?Number(data.rrr).toFixed(2):'—')}</b></span>
      </div>
      {ended && (
        <div className="result">
          <div className="lbl">MATCH RESULT</div>
          <div className="txt">{data.matchResult||'Match completed'}</div>
          <div className="sc">{ta}: {fa.main} {fa.sub} · {tb}: {fb.main} {fb.sub}</div>
          {pom?<div className="pom">★ Man of the match: {pom}</div>:null}
        </div>
      )}
    </div>
  );
}

function BatTable({list}){
  if(!list?.length) return <div className="muted">Yet to bat</div>;
  return <table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
    <tbody>{list.map((p,i)=>{const r=p.runs|0,b=p.balls|0,sr=b?Math.round(r/b*1000)/10:0;
      return <tr key={i}><td>{p.name||'—'}{p.isOut?'':' *'}</td><td>{r}</td><td>{b}</td><td>{p.fours|0}</td><td>{p.sixes|0}</td><td>{sr}</td></tr>})}</tbody></table>;
}
function BowlTable({list}){
  if(!list?.length) return <div className="muted">Yet to bowl</div>;
  return <table><thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
    <tbody>{list.map((p,i)=>{const bb=p.bowlBalls!=null?p.bowlBalls|0:p.balls|0;const rr=p.bowlRuns!=null?p.bowlRuns|0:p.runs|0;
      const o=Math.floor(bb/6)+'.'+(bb%6);const econ=bb?(rr/(bb/6)).toFixed(2):'0.00';
      return <tr key={i}><td>{p.name||'—'}</td><td>{o}</td><td>{rr}</td><td>{p.wickets|0}</td><td>{econ}</td></tr>})}</tbody></table>;
}

function App(){
  const {data,viewers,connected}=useLiveMatch();
  const [tab,setTab]=useState('live');
  const [welcome,setWelcome]=useState(true);
  const [ttsOn,setTtsOn]=useState(()=>localStorage.getItem('cricket_tts_on')!=='0');
  const [theme,setTheme]=useState(()=>localStorage.getItem('react_live_theme')||'dark');
  const [scoreFmt,setScoreFmt]=useState(()=>localStorage.getItem('react_score_fmt')||'classic');
  const [settingsOpen,setSettingsOpen]=useState(false);
  const [scTeam,setScTeam]=useState(null);
  const [event,setEvent]=useState(null);
  const prevRef=useRef(null); const lastEvKey=useRef(''); const lastComm=useRef('');
  const lines=useMemo(()=>teamLines(data),[data]);
  const players=useMemo(()=>playersList(data),[data]);
  const history=Array.isArray(data?.matchHistory)?data.matchHistory:(Array.isArray(data?.todayMatches)?data.todayMatches:[]);

  useEffect(()=>{
    document.body.classList.remove('theme-dark','theme-light','theme-ipl','theme-icc');
    document.body.classList.add('theme-'+theme);
  },[theme]);
  useEffect(()=>{if(scTeam==null&&lines)setScTeam(lines.batting==='B'?'B':'A')},[lines,scTeam]);
  useEffect(()=>{
    if(!data)return;
    const ev=detectEvent(data,prevRef.current);
    const key=ev?(data.balls+'|'+ev.kind+'|'+ev.text):'';
    if(ev&&key!==lastEvKey.current){lastEvKey.current=key;setEvent(ev);const t=setTimeout(()=>setEvent(null),2800);prevRef.current={runs:data.runs,wickets:data.wickets};return ()=>clearTimeout(t)}
    prevRef.current={runs:data.runs,wickets:data.wickets};
  },[data]);
  useEffect(()=>{
    if(!data||!ttsOn)return;
    const arr=data.commentary||[]; const line=arr.length?String(arr[arr.length-1]):'';
    if(line&&line!==lastComm.current){lastComm.current=line;speakMale(line)}
  },[data,ttsOn]);

  const balls=(data?.thisOver?.balls)||data?.currentOverBalls||[];
  const TABS=[
    ['live','LIVE'],['scorecard','SCORECARD'],['commentary','COMMENTARY'],
    ['fow','FOW'],['caps','CAPS'],['info','INFO'],['players','PLAYERS'],
    ['history','HISTORY'],['viewers','VIEWERS']
  ];

  return (
    <div className="app">
      {welcome&&<Welcome data={data} onDone={()=>setWelcome(false)}/>}
      <div onClick={e=>e.stopPropagation()}>
        <Scoreboard data={data} viewers={viewers} connected={connected} event={event}
          scoreFmt={scoreFmt} scoreFmtSet={setScoreFmt}
          settingsOpen={settingsOpen} setSettingsOpen={setSettingsOpen}
          theme={theme} setTheme={setTheme} ttsOn={ttsOn} setTtsOn={setTtsOn}/>
      </div>
      <div className="tabs">
        {TABS.map(([id,label])=>(
          <button key={id} className={tab===id?'on':''} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>
      <div className="panel">
        {tab==='live'&&(
          <>
            <div className="card"><h3>On strike</h3>
              <div className="players">
                <div className="pbox"><div className="k">Striker</div><div className="v">{data?.strikerName||'—'}</div><div className="s">{data?.strikerRuns??0} ({data?.strikerBalls??0})</div></div>
                <div className="pbox"><div className="k">Bowler</div><div className="v">{data?.bowlerName||'—'}</div><div className="s">{data?.bowlerRuns??0}/{data?.bowlerWickets??0}</div></div>
              </div>
            </div>
            <div className="card"><h3>This over</h3>
              <div className="chips">{(balls||[]).map((b,i)=>{const lab=typeof b==='object'?(b.label||''):String(b??'');return <span key={i} className={chipClass(lab)}>{lab||'•'}</span>})}
                {!balls?.length&&<span className="muted">No balls yet</span>}</div>
            </div>
          </>
        )}
        {tab==='scorecard'&&(
          <div className="card">
            <div className="subtabs">
              <button className={scTeam==='A'?'on':''} onClick={()=>setScTeam('A')}>{lines.nameA}</button>
              <button className={scTeam==='B'?'on':''} onClick={()=>setScTeam('B')}>{lines.nameB}</button>
            </div>
            <h3>Batting</h3><BatTable list={scTeam==='B'?lines.batB:lines.batA}/>
            <h3 style={{marginTop:14}}>Bowling</h3><BowlTable list={scTeam==='B'?lines.bowlB:lines.bowlA}/>
          </div>
        )}
        {tab==='commentary'&&(
          <div className="card">
            <div className="row">
              <button className={'btn'+(ttsOn?' on':'')} onClick={()=>{const n=!ttsOn;setTtsOn(n);localStorage.setItem('cricket_tts_on',n?'1':'0');if(n)speakMale('Male commentary on')}}>Voice {ttsOn?'ON · Male':'OFF'}</button>
              <button className="btn" onClick={()=>speakMale('Four runs! Brilliant timing!')}>Test male voice</button>
            </div>
            {(data?.commentary||[]).slice().reverse().slice(0,40).map((line,i)=><div className="comm-item" key={i}>{String(line)}</div>)}
            {!(data?.commentary||[]).length&&<div className="muted">No commentary yet</div>}
          </div>
        )}
        {tab==='fow'&&(
          <div className="card"><h3>Fall of wickets</h3>
            <table><thead><tr><th>#</th><th>Score</th><th>Batter</th><th>Dismissal</th></tr></thead>
              <tbody>{(data?.fallOfWickets||[]).map((w,i)=><tr key={i}><td>{i+1}</td><td>{w.score??w.runs??'—'}</td><td>{w.batsman||w.player||w.name||'—'}</td><td>{w.dismissal||w.howOut||'—'}</td></tr>)}
                {!(data?.fallOfWickets||[]).length&&<tr><td colSpan="4" className="muted">No wickets yet</td></tr>}</tbody></table>
          </div>
        )}
        {tab==='caps'&&(
          <div className="card">
            <h3>Orange cap</h3>
            <table><thead><tr><th>#</th><th>Player</th><th>Runs</th><th>Avg</th></tr></thead>
              <tbody>{(data?.orangeCap||[]).slice(0,15).map((p,i)=><tr key={i}><td>{i+1}</td><td>{p.name}</td><td>{p.runs||0}</td><td>{p.avg!=null?p.avg:(p.average!=null?p.average:'—')}</td></tr>)}
                {!(data?.orangeCap||[]).length&&<tr><td colSpan="4" className="muted">No data from scorer</td></tr>}</tbody></table>
            <h3 style={{marginTop:14}}>Purple cap</h3>
            <table><thead><tr><th>#</th><th>Player</th><th>Wkts</th><th>Runs</th></tr></thead>
              <tbody>{(data?.purpleCap||[]).slice(0,15).map((p,i)=><tr key={i}><td>{i+1}</td><td>{p.name}</td><td>{p.wickets||0}</td><td>{p.runs||p.bowlRuns||0}</td></tr>)}
                {!(data?.purpleCap||[]).length&&<tr><td colSpan="4" className="muted">No data from scorer</td></tr>}</tbody></table>
          </div>
        )}
        {tab==='info'&&(
          <div className="card">
            <h3>Match info · Dashboard</h3>
            <div className="kv">
              <div className="item"><div className="k">Teams</div><div className="v">{(data?.teamA||'Team A')+' vs '+(data?.teamB||'Team B')}</div></div>
              <div className="item"><div className="k">Status</div><div className="v">{data?.matchEnded?(data.matchResult||'Completed'):(data?.statusText||'Live')}</div></div>
              <div className="item"><div className="k">Toss</div><div className="v">{data?.tossText||data?.toss||'—'}</div></div>
              <div className="item"><div className="k">Overs</div><div className="v">{data?.maxOvers||data?.totalOvers||'—'}</div></div>
              <div className="item"><div className="k">Venue</div><div className="v">{data?.venue||data?.location||'—'}</div></div>
              <div className="item"><div className="k">Started</div><div className="v">{data?.matchStartTime?fmtTime(data.matchStartTime):(data?.startTime?fmtTime(data.startTime):'—')}</div></div>
              <div className="item"><div className="k">Target</div><div className="v">{data?.target||data?.targetScore||'—'}</div></div>
              <div className="item"><div className="k">Innings</div><div className="v">{data?.innings||1}</div></div>
            </div>
          </div>
        )}
        {tab==='players'&&(
          <div className="card">
            <h3>Players · Squad</h3>
            <div className="subtabs">
              <button className={scTeam!=='B'?'on':''} onClick={()=>setScTeam('A')}>{lines.nameA}</button>
              <button className={scTeam==='B'?'on':''} onClick={()=>setScTeam('B')}>{lines.nameB}</button>
            </div>
            <table><thead><tr><th>#</th><th>Player</th></tr></thead>
              <tbody>{(scTeam==='B'?(players.b.length?players.b:lines.batB):(players.a.length?players.a:lines.batA)).map((p,i)=>(
                <tr key={i}><td>{i+1}</td><td>{typeof p==='string'?p:(p.name||'—')}</td></tr>
              ))}
              {!(scTeam==='B'?players.b:players.a).length&&!(scTeam==='B'?lines.batB:lines.batA).length&&(
                <tr><td colSpan="2" className="muted">No squad data in live payload yet</td></tr>
              )}
            </tbody></table>
          </div>
        )}
        {tab==='history'&&(
          <div className="card">
            <h3>Match history · Dashboard</h3>
            <table><thead><tr><th>Match</th><th>Result</th><th>When</th></tr></thead>
              <tbody>
                {history.slice(0,20).map((h,i)=>(
                  <tr key={i}>
                    <td>{h.teamA||h.teams||h.name||('Match '+(i+1))}</td>
                    <td>{h.result||h.matchResult||h.summary||'—'}</td>
                    <td>{fmtTime(h.ts||h.endedAt||h.date)}</td>
                  </tr>
                ))}
                {!history.length&&<tr><td colSpan="3" className="muted">No finished matches in payload (mirrors scorer dashboard when published)</td></tr>}
              </tbody>
            </table>
          </div>
        )}
        {tab==='viewers'&&(
          <div className="card">
            <h3>Viewers</h3>
            <table><thead><tr><th>Name</th><th>Status</th><th>Log in</th><th>Out</th><th>Activity</th></tr></thead>
              <tbody>
                {(viewers.length?viewers:[{name:'You',status:'online',joinedAt:Date.now(),activity:'watching'}]).map((v,i)=>{
                  const online=!(v.status==='offline'||v.online===false);
                  return <tr key={i}><td>{v.name||v.displayName||'Viewer'}</td>
                    <td style={{color:online?'#22c55e':'#94a3b8',fontWeight:800}}>{online?'Online':'Offline'}</td>
                    <td>{fmtTime(v.joinedAt||v.firstSeen)}</td>
                    <td>{online?'—':fmtTime(v.leftAt||v.lastSeen)}</td>
                    <td>{v.activity||v.tab||'watching'}</td></tr>
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      <div className="footer">React live · Dashboard tabs mirrored · <a href="/live.html">Vanilla</a></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
