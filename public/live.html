<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Cricket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .score { font-size: 2.4rem; font-weight: 800; }
    .overs { font-size: 0.95rem; opacity: 0.75; }
    .chase { background: #7f1d1d; padding: 8px; text-align: center; font-weight: 700; animation: pulse 1.2s infinite; }
    .chase.urgent { animation: pulse 0.6s infinite; background: #991b1b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .tabs { display: flex; background: #1e293b; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; }
    .tab.active { background: #334155; }
    .panel { display: none; padding: 12px; height: 55vh; overflow-y: auto; }
    .panel.active { display: block; }
    .chat-input { display: flex; gap: 8px; padding: 8px; background: #1e293b; }
    .chat-input input { flex: 1; padding: 8px; border-radius: 6px; border: none; }
    .float { position: fixed; font-size: 2rem; animation: floatUp 3s forwards; pointer-events: none; }
    @keyframes floatUp { to { transform: translateY(-120px); opacity: 0; } }
    .anim { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 4rem; font-weight: 900; z-index: 99; animation: pop 1.2s forwards; }
    @keyframes pop { 0%{scale:0.3;opacity:0} 30%{scale:1.2;opacity:1} 100%{scale:1;opacity:0} }
    .ball { display: inline-block; margin: 4px; padding: 6px 10px; background: #334155; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="score" id="score">0 / 0</div>
      <div class="overs" id="overs">(0.0)</div>
    </div>
    <div id="status">Connecting…</div>
  </div>

  <div id="chase" class="chase" style="display:none"></div>

  <div class="tabs">
    <div class="tab active" data-tab="over">This Over</div>
    <div class="tab" data-tab="chat">Chat</div>
    <div class="tab" data-tab="viewers">Viewers</div>
    <div class="tab" data-tab="coins">Gold Coins</div>
  </div>

  <div id="over" class="panel active"></div>
  <div id="chat" class="panel"></div>
  <div id="viewers" class="panel"></div>
  <div id="coins" class="panel"></div>

  <div class="chat-input">
    <input id="msg" placeholder="Type message…" />
    <button onclick="sendChat()">Send</button>
  </div>

  <script>
    const MATCH = new URLSearchParams(location.search).get("match") || "default";
    let ws, lastEventKey = null;

    function connect() {
      const name = localStorage.getItem("viewerName") || prompt("Your name") || "Fan";
      localStorage.setItem("viewerName", name);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?match=${MATCH}&name=${encodeURIComponent(name)}&role=viewer`);

      ws.onopen = () => document.getElementById("status").textContent = "Live";
      ws.onclose = () => {
        document.getElementById("status").textContent = "Reconnecting…";
        setTimeout(connect, 1500 + Math.random() * 2000);
      };
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          handle(msg);
        } catch (_) {}
      };
    }

    function handle(msg) {
      if (msg.type === "full" || msg.type === "update") {
        const d = msg.data;
        document.getElementById("score").textContent = `${d.score.runs} / ${d.score.wickets}`;
        document.getElementById("overs").textContent = `(${d.score.overs})`;

        // This over balls
        const overEl = document.getElementById("over");
        overEl.innerHTML = (d.thisOver || [])
          .map(b => `<span class="ball">${b}</span>`).join("");

        // Chase timer
        const chase = document.getElementById("chase");
        if (d.chase) {
          chase.style.display = "block";
          chase.className = "chase" + (d.chase.urgent ? " urgent" : "");
          chase.textContent = `⚡ Need ${d.chase.need} runs in ${d.chase.balls} balls (${d.chase.overs} ov left)`;
        } else {
          chase.style.display = "none";
        }

        // Animation – fire only once per unique event
        if (d.lastEvent) {
          const key = `${d.lastEvent.ts}-${d.lastEvent.event}-${d.lastEvent.runs}`;
          if (key !== lastEventKey && !d.matchEnded) {
            lastEventKey = key;
            playAnim(d.lastEvent);
          }
        }

        // Viewers
        document.getElementById("viewers").innerHTML = (d.viewers || [])
          .map(v => `<div>${v.name} – online since ${new Date(v.joinedAt).toLocaleTimeString()}</div>`)
          .join("") || "<div>No viewers yet</div>";

        // Gold coins list
        document.getElementById("coins").innerHTML = Object.entries(d.goldCoins || {})
          .map(([u, c]) => `<div>${u}: ${c} 🪙</div>`).join("") || "No coins yet";
      }

      if (msg.type === "chat") {
        const el = document.getElementById("chat");
        el.innerHTML = (msg.data || [])
          .map(c => `<div><b>${c.name}</b>: ${c.text}</div>`).join("");
        el.scrollTop = el.scrollHeight;
      }

      if (msg.type === "float") {
        const f = document.createElement("div");
        f.className = "float";
        f.textContent = msg.data.emoji;
        f.style.left = Math.random() * 80 + 10 + "%";
        f.style.bottom = "20%";
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 3000);
      }

      if (msg.type === "presence") {
        document.getElementById("viewers").innerHTML = (msg.data || [])
          .map(v => `<div>${v.name} – online</div>`).join("") || "<div>No viewers yet</div>";
      }
    }

    function playAnim(ev) {
      const el = document.createElement("div");
      el.className = "anim";
      el.textContent = ev.event === "W" ? "WICKET!" : (ev.runs === 4 || ev.runs === 6 ? ev.runs + "!" : String(ev.runs));
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function sendChat() {
      const input = document.getElementById("msg");
      if (!input.value.trim() || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ type: "chat", text: input.value.trim() }));
      input.value = "";
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        document.getElementById(t.dataset.tab).classList.add("active");
      };
    });

    // Enter key for chat
    document.getElementById("msg").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    connect();
  </script>
</body>
</html>
