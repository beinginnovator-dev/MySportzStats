name = "mysportzstats-e2e-staging"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mysportzstats-e2e-staging-20261114"
database_id = "42a46c85-bce1-4a8e-a97e-4adc6f47f015"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
