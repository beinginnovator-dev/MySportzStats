  function unwrap(msg){
    if(!msg||typeof msg!=='object')return null;

    if(msg.type==='presence'||msg.type==='pong'||msg.type==='chat'||msg.type==='float') return null;
    if(msg.type==='mic'||String(msg.type||'').indexOf('webrtc')===0||msg.type==='mic-join') return null;
    var d=msg;
    if(msg.data&&typeof msg.data==='object'){
      d=msg.data;
      // prefer nested but keep top-level fallbacks
      if(d.runs==null&&msg.runs!=null) d.runs=msg.runs;
      if(d.wickets==null&&msg.wickets!=null) d.wickets=msg.wickets;
      if(d.balls==null&&msg.balls!=null) d.balls=msg.balls;
    }
    if(d.runs==null&&d.score&&typeof d.score==='object'){
      d.runs=d.score.runs; d.wickets=d.score.wickets; d.overs=d.overs||d.score.overs;

  function chipClass(lab){
    lab=String(lab||'').toUpperCase();
    if(lab==='4')return 'chip c4';
    if(lab==='6')return 'chip c6';
    if(lab==='W'||(lab.charAt(0)==='W'&&lab.indexOf('WD')<0))return 'chip cw';
    if(/WD|NB|LB/.test(lab))return 'chip cx';
    if(lab==='0'||lab==='.'||lab==='•')return 'chip c0';

  function detectEvent(d,prev){
    if(!d)return null;
    var chipArr=(d.thisOver&&d.thisOver.balls)||d.currentOverBalls||[];
    var chip='';
    if(chipArr.length){
      var last=chipArr[chipArr.length-1];
      chip=String(typeof last==='object'?(last.label||last.chip||''):last).toUpperCase().trim();
    }
    var ev=String(d.lastEvent||d.event||'').toLowerCase();
    if(chip==='W'||(chip.charAt(0)==='W'&&chip.indexOf('WD')<0)||ev.indexOf('wicket')>=0)return {kind:'wicket',text:'WICKET'};
    if(chip==='6'||ev==='six')return {kind:'six',text:'SIX'};
    if(chip==='4'||ev==='four')return {kind:'four',text:'FOUR'};
    if(chip.indexOf('WD')>=0||ev==='wide')return {kind:'extra',text:'WIDE'};
    if(chip.indexOf('NB')>=0)return {kind:'extra',text:'NO BALL'};
    if(chip.indexOf('LB')>=0)return {kind:'extra',text:'LEG BYE'};
    if(chip==='0'||chip==='.'||chip==='•'||ev==='dot')return {kind:'dot',text:'DOT'};
    if(chip==='3')return {kind:'runs',text:'3 RUNS'};
    if(chip==='2')return {kind:'runs',text:'2 RUNS'};
    if(chip==='1')return {kind:'runs',text:'1 RUN'};
    if(prev){
      if(n(d.wickets)>n(prev.wickets))return {kind:'wicket',text:'WICKET'};
      var dr=n(d.runs)-n(prev.runs);
      if(dr===6)return {kind:'six',text:'SIX'};
      if(dr===4)return {kind:'four',text:'FOUR'};
      if(dr===0&&n(d.balls)>n(prev.balls))return {kind:'dot',text:'DOT'};
      if(dr===3)return {kind:'runs',text:'3 RUNS'};
      if(dr===2)return {kind:'runs',text:'2 RUNS'};
      if(dr===1)return {kind:'runs',text:'1 RUN'};
    }
    return null;
  }
  function getMaleVoice(){
    var voices=speechSynthesis.getVoices()||[];
    var male=/male|david|daniel|mark|james|george|thomas|alex|ravi|guy|ryan/i;
    var female=/female|zira|susan|linda|karen|moira|samantha|victoria|fiona/i;
    for(var i=0;i<voices.length;i++){
      if(male.test(voices[i].name)&&!female.test(voices[i].name)&&/en/i.test(voices[i].lang||''))return voices[i];
    }
    for(var j=0;j<voices.length;j++){
      if(/en/i.test(voices[j].lang||'')&&!female.test(voices[j].name))return voices[j];
    }
    return null;
  }

  function formatCommLine(line){
    line=String(line||'');

    var clean=line.replace(/\*+/g,'').trim();
    var m=clean.match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
    var over='', rest=clean;
    if(m){ over=m[1]; rest=m[2]; }
    // highlight events
    rest=rest.replace(/\b(SIX|FOUR|FOUR!|SIX!)\b/gi, function(x){ return '|||HIB|||'+x+'|||/HIB|||'; });
    rest=rest.replace(/\b(WICKET|OUT|CAUGHT|BOWLED|LBW|RUN OUT|STUMPED)\b/gi, function(x){ return '|||HIW|||'+x+'|||/HIW|||'; });
    rest=rest.replace(/\b(\d+)\s*runs?\b/gi, function(x){ return '|||HIB|||'+x+'|||/HIB|||'; });

  function renderCommLine(line, key){

  function useLiveMatch(){
    var _d=useState(null),data=_d[0],setData=_d[1];
    var _v=useState([]),viewers=_v[0],setViewers=_v[1];
    var _c=useState(false),connected=_c[0],setConnected=_c[1];
    var lastSig=useRef('');
    var wsRef=useRef(null);
    var apply=useCallback(function(raw){
      var d=unwrap(raw);if(!d)return;
      // Always accept if runs/wickets/balls/overs/ts/striker change
      var chip='';
      try{
        var arr=(d.thisOver&&d.thisOver.balls)||d.currentOverBalls||[];
        chip=arr.map(function(x){return typeof x==='object'?(x.label||''):String(x);}).join(',');
      }catch(e){}
      var sig=[d.runs,d.wickets,d.balls,d.overs,d.innings,d.ts,d.strikerName,d.bowlerName,d.matchEnded,chip].join('|');
      if(sig===lastSig.current)return;

      setData(function(prev){
        // merge so partial payloads still update scoreboard
        if(prev && typeof prev==='object') return Object.assign({}, prev, d);
        return d;
      });
      if(Array.isArray(d.viewers)) setViewers(d.viewers);
      else if(d.viewersCount!=null){ /* keep */ }
    },[]);
    useEffect(function(){
      var match=new URLSearchParams(location.search).get('match')||'current';
      var dead=false,retry=0,pollTimer;
      function connect(){
        if(dead)return;
        try{
          var proto=location.protocol==='https:'?'wss:':'ws:';
          var ws=new WebSocket(proto+'//'+location.host+'/ws?match='+encodeURIComponent(match)+'&name=ReactFan');
          wsRef.current=ws;
          ws.onopen=function(){setConnected(true);retry=0;};
          ws.onmessage=function(ev){
            try{
              var msg=JSON.parse(ev.data);
              if(!msg||msg.type==='pong')return;
              if(msg.type==='presence'){setViewers(Array.isArray(msg.data)?msg.data:[]);return;}
              if(msg.type==='full'||msg.type==='update'||msg.type==='score'||msg.runs!=null)apply(msg.data||msg);
            }catch(e){}
          };
          ws.onclose=function(){setConnected(false);setTimeout(connect,Math.min(15000,800+retry++*700));};
        }catch(e){}
      }
      connect();

        fetch('/api/live-public?match='+encodeURIComponent(match)+'&_='+Date.now(),{cache:'no-store'})
          .then(function(r){return r.ok?r.json():null;})
          .then(function(j){if(j)apply(j);})
          .catch(function(){});

    },[apply]);

<script id="mic-webrtc-listener">
(function(){
  var pc=null, remoteAudio=null, micWs=null, viewerId='fan_'+Math.random().toString(36).slice(2,10);
  var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
  function matchId(){
    try{ return new URLSearchParams(location.search).get('match')||'current'; }catch(e){ return 'current'; }
  }
  function ensureAudioEl(){
    if(remoteAudio) return remoteAudio;
    remoteAudio=document.createElement('audio');
    remoteAudio.autoplay=true;
    remoteAudio.playsInline=true;
    remoteAudio.setAttribute('playsinline','');
    remoteAudio.style.display='none';
    document.body.appendChild(remoteAudio);
    return remoteAudio;
  }
  function setBadge(live, name){
    var el=document.getElementById('mic-live-badge');
    if(!el){
      el=document.createElement('div');
      el.id='mic-live-badge';
      el.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.45);border:2px solid #fff;';
      document.body.appendChild(el);
    }
    if(live){
      el.style.display='block';
      el.style.background='#e11d48';
      el.style.color='#fff';
      el.textContent='🎙️ Live mic'+(name?(' · '+name):'')+' · tap to unmute';
      el.onclick=function(){ try{ ensureAudioEl().play(); }catch(e){} el.textContent='🎙️ Live mic'+(name?(' · '+name):'')+' · listening'; };
    } else {
      el.style.display='none';
    }
  }
  function cleanupPc(){
    try{ if(pc) pc.close(); }catch(e){}
    pc=null;
  }
  function send(msg){ try{ if(micWs&&micWs.readyState===1) micWs.send(JSON.stringify(msg)); }catch(e){} }
  window.__micJoin=function(){ try{ send({ type:'mic-join', viewerId: viewerId }); }catch(e){} };
  function attachListenerSocket(){
    // Prefer existing app socket if any; else open dedicated
    var proto=location.protocol==='https:'?'wss:':'ws:';
    var url=proto+'//'+location.host+'/ws?match='+encodeURIComponent(matchId())+'&role=viewer&name='+encodeURIComponent('Fan');
    try{ if(micWs) micWs.close(); }catch(e){}
    micWs=new WebSocket(url);
    micWs.onopen=function(){ send({ type:'mic-join', viewerId: viewerId }); };
    micWs.onmessage=function(ev){
      var msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
      if(msg.type==='mic'){
        if(msg.data&&msg.data.live){ setBadge(true, msg.data.name); window.__micLive=true; window.__micName=msg.data.name||''; send({ type:'mic-join', viewerId: viewerId }); try{document.dispatchEvent(new CustomEvent('mic-live',{detail:{live:true,name:msg.data.name}}));}catch(e){} }
        else { setBadge(false); window.__micLive=false; cleanupPc(); try{document.dispatchEvent(new CustomEvent('mic-live',{detail:{live:false}}));}catch(e){} }
      } else if(msg.type==='webrtc-offer' && msg.sdp){
        handleOffer(msg);
      } else if(msg.type==='webrtc-ice' && msg.candidate){
        if(pc) pc.addIceCandidate(msg.candidate).catch(function(){});
      } else if(msg.type==='full' && msg.data && msg.data.micLive){
        setBadge(true, msg.data.micName||'');
        send({ type:'mic-join', viewerId: viewerId });
      }
    };
    micWs.onclose=function(){ setTimeout(attachListenerSocket, 2000); };
  }
  async function handleOffer(msg){
    cleanupPc();
    pc=new RTCPeerConnection({ iceServers: ICE });
    pc.ontrack=function(ev){
      var a=ensureAudioEl();
      a.srcObject=ev.streams[0]||new MediaStream([ev.track]);
      a.play().catch(function(){ setBadge(true, 'tap to unmute'); });
    };
    pc.onicecandidate=function(ev){
      if(ev.candidate) send({ type:'webrtc-ice', viewerId: viewerId, candidate: ev.candidate });
    };
    await pc.setRemoteDescription(msg.sdp);
    var answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type:'webrtc-answer', viewerId: viewerId, sdp: pc.localDescription });
  }
  // boot
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', attachListenerSocket);
  else attachListenerSocket();
})();
</script>
