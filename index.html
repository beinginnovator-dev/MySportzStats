<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MyCricStats · Admin</title>
<meta name="theme-color" content="#01002C"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#a8a8c8;--red:#FF0F50;--gold:#fbbf24;--blue:#7dd3fc;--accent:#FF0F50;--ok:#22c55e}
body.theme-dark{--bg:#01002C;--bg2:#0a0a3a;--card:#12123f}
body.theme-light{--bg:#f4f4f8;--bg2:#fff;--card:#fff;--line:rgba(1,0,44,.12);--text:#01002C;--muted:#5c5c7a;--accent:#FF0F50;--blue:#0284c7;--gold:#b45309}
body.theme-pitch{--bg:#062816;--bg2:#0c3d22;--card:#0f4a2a;--line:rgba(52,211,153,.2);--text:#ecfdf5;--muted:#6ee7b7;--accent:#10b981;--blue:#34d399}
body.theme-night{--bg:#0b1020;--bg2:#151b2e;--card:#1c2438}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding-bottom:32px;min-height:100vh;display:flex;flex-direction:column}
.top-chrome{position:sticky;top:0;z-index:40;background:var(--bg);flex-shrink:0}
.broadcast{position:relative!important;top:auto!important;max-height:36vh}
.tabs{position:relative!important;top:auto!important;z-index:1}
.panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.broadcast{position:sticky;top:0;z-index:30;background:#01002C;border-bottom:1px solid var(--line);padding:0 0 6px;overflow:visible;min-height:auto;max-height:none;display:flex;flex-direction:column}
.broadcast .bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.broadcast .bg-overlay{position:absolute;inset:0;background:#01002C;z-index:1}
.broadcast .bc-content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 4px;min-height:40px}
.bar .icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font-size:15px;cursor:pointer;font-family:inherit}
.brand-sub{font-size:10px;font-weight:700;letter-spacing:0.4px;color:#cbd5e1;margin-top:1px;text-align:center}
.brand-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#fff;letter-spacing:.06em}
.brand-chip img{width:28px;height:28px;border-radius:50%;/* no breathe */border:2px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.6)}
@keyframes logoBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{transform:scale(1.12);filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}}
.ball-stage{position:absolute;left:0;right:0;bottom:40%;height:140px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:visible}
.bounce-ball{position:relative;width:64px;height:auto;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center}
.bounce-ball.show{opacity:1}
.bounce-ball .ball-core{
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#f3f4f6 45%,#e5e7eb 100%);
  border:2px solid #d1d5db;
  box-shadow:0 8px 20px rgba(0,0,0,.35), inset -4px -6px 10px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.bounce-ball .ball-core::after{
  content:'';position:absolute;inset:10px 18px;border:1.5px solid rgba(239,68,68,.35);border-radius:50%;
}
.ball-text{margin-top:6px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 4px #000;text-align:center;max-width:120px;line-height:1.2}
.bounce-ball .run-stamp{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  min-width:34px;padding:4px 8px;border-radius:8px;
  background:#fff;font-weight:900;font-size:14px;line-height:1.1;
  text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap;z-index:2;
}
.bounce-ball .run-stamp.s0{color:#64748b}
.bounce-ball .run-stamp.s1{color:#2563eb}
.bounce-ball .run-stamp.s2{color:#0284c7}
.bounce-ball .run-stamp.s3{color:#0d9488}
.bounce-ball .run-stamp.s4{color:#16a34a}
.bounce-ball .run-stamp.s6{color:#7c3aed}
.bounce-ball .run-stamp.sw{color:#dc2626;font-size:11px;min-width:52px}
.bounce-ball .run-stamp.swd{color:#db2777}
.bounce-ball .run-stamp.snb{color:#c026d3}
.bounce-ball .run-stamp.slb{color:#9333ea}
.bounce-ball .run-stamp.sby{color:#7e22ce}
/* approach from far (small) to near (large) */
.bounce-ball.approach{animation:ballPop 5s ease-out forwards}
.bounce-ball.approach.r6{animation-duration:1.55s}
.bounce-ball.approach.r4{animation-duration:1.45s}
.bounce-ball.approach.rw{animation-duration:1.5s}
@keyframes ballPop{0%{transform:translateY(80px) scale(0.6);opacity:0}15%{opacity:1;transform:translateY(0) scale(1.05)}40%{transform:translateY(-8px) scale(1)}70%{opacity:1}100%{transform:translateY(-20px) scale(1);opacity:0}}
@keyframes ballApproach{
  0%{transform:translateY(-40px) scale(0.2);opacity:0}
  10%{opacity:1}
  40%{transform:translateY(20px) scale(1.1)}
  60%{transform:translateY(4px) scale(0.96)}
  80%{transform:translateY(12px) scale(1.04)}
  95%{opacity:1}
  100%{transform:translateY(-10px) scale(1);opacity:0}
}
.news-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.news-thumb{width:88px;height:66px;border-radius:10px;object-fit:cover;background:rgba(127,127,127,.15);flex-shrink:0}
.news-body{min-width:0;flex:1}
.news-body .nt{font-weight:800;font-size:13px;line-height:1.35}
.news-body .nd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.news-body .nm{font-size:11px;color:var(--muted);margin-top:4px}
.news-ticker{display:flex;gap:10px;align-items:center;padding:8px 4px;min-height:56px}
.news-ticker img{width:56px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(0,0,0,.3)}
.news-ticker .nt-text{flex:1;min-width:0;overflow:hidden;height:40px;position:relative}
.news-ticker .nt-scroll{position:absolute;left:0;top:0;width:100%;animation:newsScroll 12s linear infinite}
.news-ticker .nt-title{font-size:12px;font-weight:800;color:#fde68a;line-height:1.3}
.news-ticker .nt-desc{font-size:11px;color:#e2e8f0;margin-top:2px;line-height:1.3}
@keyframes newsScroll{0%{transform:translateY(0);opacity:1}70%{transform:translateY(0);opacity:1}85%{transform:translateY(-50%);opacity:0}86%{transform:translateY(40%);opacity:0}100%{transform:translateY(0);opacity:1}}
.news-player{padding:10px 8px;background:transparent;border-radius:12px}
.news-player .np-title{color:#fde68a!important}
.news-player .np-desc{color:#e2e8f0!important}
.news-player .np-meta{color:#94a3b8!important}
.news-player .np-controls button{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.3)}
.comm-toolbar{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;align-items:center;margin-bottom:10px}
.comm-toolbar .btn{padding:8px 10px;font-size:11px;white-space:nowrap}
.flip-card{min-height:72px;border-radius:14px;border:1px solid var(--line);padding:12px;margin:4px 0;background:rgba(0,0,0,.25);text-align:center}
.flip-card .ft{font-size:12px;font-weight:800;color:#fde68a}
.flip-card .fs{font-size:14px;font-weight:900;margin-top:4px}
.flip-card .fm{font-size:11px;color:#cbd5e1;margin-top:4px}
.chat-box{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.chat-msg{padding:8px 10px;border-radius:12px;background:rgba(127,127,127,.08);border:1px solid var(--line);font-size:13px}
.chat-msg b{font-weight:800}
.chat-input-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chat-input-row input{flex:1;min-width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.emoji-row button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 8px;font-size:16px;cursor:pointer}
.chat-pop{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:min(520px,100%);
  height:min(58vh,480px);
  z-index:35; /* under sticky scoreboard chrome (40) so score stays visible */
  background:#0b141a;border-top:1px solid rgba(255,255,255,.12);
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.45);
}
.chat-pop .cp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1f2c34;border-radius:16px 16px 0 0}
.chat-pop .cp-head .t{flex:1;font-weight:800;font-size:14px;color:#e9edef}
.chat-pop .cp-body{flex:1;overflow:auto;padding:10px;background:#0b141a}
.chat-pop .cp-msg{max-width:82%;margin:6px 0;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.35;color:#e9edef}
.chat-pop .cp-msg.me{margin-left:auto;background:#005c4b}
.chat-pop .cp-msg.them{margin-right:auto;background:#1f2c34}
.chat-pop .cp-foot{padding:8px;background:#1f2c34;display:flex;gap:6px;align-items:center}
.chat-pop .cp-foot input{flex:1;border:0;border-radius:20px;padding:10px 14px;background:#2a3942;color:#fff;font-family:inherit}
.chat-fab{position:fixed;right:14px;bottom:18px;z-index:34;width:54px;height:54px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:22px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer}
.float-praise{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);z-index:9500;background:rgba(255,15,80,.92);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;animation:evpop 3s ease-out forwards;pointer-events:none;max-width:90vw;text-align:center}

.news-player{padding:10px 8px;background:transparent;border-radius:12px}
.news-player .np-row{display:flex;gap:10px;align-items:flex-start}
.news-player .np-img{width:120px;height:96px;object-fit:cover;border-radius:10px;background:rgba(0,0,0,.25);flex-shrink:0}
.news-player .np-copy{flex:1;min-width:0}
.news-player .np-title{font-size:13px;font-weight:800;color:#fde68a;line-height:1.35}
.news-player .np-desc{font-size:12px;color:#e2e8f0;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.news-player .np-meta{font-size:10px;color:#94a3b8;margin-top:4px}
.news-player .np-controls{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.news-player .np-controls button{min-width:40px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:0 12px}
.live-pair{grid-template-columns:1fr 1fr 1fr!important}


.inapp{position:fixed;inset:0;z-index:11000;background:var(--bg);display:flex;flex-direction:column}
.inapp-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.inapp-bar .title{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inapp iframe{flex:1;width:100%;border:0;background:#fff}


.brand-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tname img.flag{width:18px;height:12px;object-fit:cover;border-radius:2px;flex-shrink:0}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,15,80,.2);border:1px solid rgba(255,15,80,.5);color:#fecdd3;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#FF0F50;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.done-pill{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:4px 10px;border-radius:999px}
.view-badge{font-size:10px;font-weight:800;background:rgba(255,15,80,.2);color:#F78DA7;padding:3px 8px;border-radius:999px}

.players-bar{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:6px;margin:6px 0}
.scoreboard-body{padding:0 14px 4px;display:flex;flex-direction:column;justify-content:flex-start}
.sponsor-slot{display:flex;align-items:center;justify-content:center;gap:6px;min-height:28px;margin-bottom:4px;font-size:11px;font-weight:700;color:#fde68a}
.match-header{text-align:center;padding:2px 4px}
.match-header .title{font-size:13px;font-weight:900;color:var(--gold);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-header .sub{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:2px}
.match-header .status-line{font-size:12px;font-weight:700;color:#e2e8f0;margin-top:4px}
.score-grid{display:grid;grid-template-columns:1fr 40px 1fr;gap:4px;align-items:start;margin-top:8px}
.side{text-align:center;min-width:0;padding:0 6px;display:flex;flex-direction:column;align-items:center}
.tname{font-size:12px;font-weight:800;text-transform:uppercase;color:#f8fafc;display:flex;align-items:center;justify-content:center;gap:5px;width:100%;max-width:100%;margin-bottom:2px}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.side-left .tname,.side-right .tname{justify-content:center}
.score-num{font-size:26px;font-weight:900;line-height:1.1;margin:2px 0 0;color:#fff;font-variant-numeric:tabular-nums;text-align:center;width:100%}
.overs{font-size:15px;color:#cbd5e1;font-weight:700;margin-top:2px;text-align:center;width:100%}
.match-center .vs-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:#94a3b8;text-align:center}
.meta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:#cbd5e1;font-weight:600}
.live-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lp{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;text-align:left}
.lp .k{font-size:9px;font-weight:800;text-transform:uppercase;color:#94a3b8}
.lp .v{font-size:12px;font-weight:800;color:#fff;margin-top:2px}
.lp-sub{font-size:12px;font-weight:600;color:#cbd5e1;margin-top:2px;line-height:1.35}.lp{cursor:pointer}.role-logo{font-size:14px;margin-right:4px}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25;/* stuck under scoreboard via layout */}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:12px;padding:13px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.panel{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:rgba(127,127,127,.08);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filter-row button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-weight:800;font-size:11px;padding:7px 12px;border-radius:999px;cursor:pointer}
.filter-row button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.match-list{display:flex;flex-direction:column;gap:8px}
.match-card{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
body.theme-light .match-card{background:#fff}
.match-card.is-live{border-color:rgba(255,15,80,.45)}
.match-card.is-sel{border-color:rgba(255,15,80,.6);background:rgba(255,15,80,.08)}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mc-live{font-size:10px;font-weight:900;color:#fecdd3;background:rgba(255,15,80,.25);padding:2px 8px;border-radius:999px}
.mc-fin{font-size:10px;font-weight:800;color:#94a3b8;background:rgba(148,163,184,.15);padding:2px 8px;border-radius:999px}
.mc-up{font-size:10px;font-weight:800;color:#7dd3fc;background:rgba(56,189,248,.15);padding:2px 8px;border-radius:999px}
.mc-meta{font-size:11px;color:var(--muted)}
.mc-teams{font-size:14px;font-weight:800;margin:2px 0}
.mc-scores{font-size:16px;font-weight:900;margin:4px 0;color:var(--blue)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;color:var(--muted);font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase}
.table td{padding:7px 4px;border-bottom:1px solid var(--line);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(127,127,127,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-bar{background:#3b0715;color:#fecaca;font-size:13px;padding:10px 14px;text-align:center;font-weight:600;line-height:1.4}
body.theme-light .error-bar{background:#fef2f2;color:#991b1b}
.footer{text-align:center;padding:16px;font-size:11px;color:var(--muted)}
.settings-dd{position:fixed;right:10px;top:48px;z-index:9999;background:var(--bg2);border:1px solid var(--line);border-radius:14px;min-width:280px;max-width:92vw;max-height:80vh;overflow:auto;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.settings-dd .dd-title{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px}
.settings-dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);font-weight:700;font-size:13px;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.settings-dd button:hover,.settings-dd button.on{background:rgba(255,15,80,.15)}
.settings-backdrop{position:fixed;inset:0;z-index:9998}
.modal-scrim{position:fixed;inset:0;z-index:10050;background:rgba(1,0,44,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{width:min(420px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;color:var(--text);max-height:90vh;overflow:auto}
.modal-card h2{font-size:16px;font-weight:900;margin:0 0 6px}
.modal-card .hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.modal-card .hint a{color:var(--blue)}
.modal-card .field{margin-bottom:12px}
.modal-card .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.modal-card .field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;font-weight:600}
.modal-card .actions{display:flex;gap:8px;margin-top:14px}
.modal-card .actions .btn{flex:1;padding:12px;border-radius:12px}
.opacity-row{display:flex;align-items:center;gap:10px;margin-top:8px}

      var fresh=prior>=0?incoming.slice(prior+1):incoming.filter(function(m){return String(m.id||m.t||'')>chatLastSeenRef.current;});

      try{

        ta.style.position='fixed';ta.style.opacity='0';ta.style.left='-9999px';
        document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
        var ok=document.execCommand('copy');document.body.removeChild(ta);
        if(ok){setToast(label||'Invitation copied');setTimeout(function(){setToast(null);},2600);return true;}
      }catch(e){}
      return false;
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(function(){
        setToast(label||'Invitation copied');setTimeout(function(){setToast(null);},2600);
      }).catch(function(){if(!legacyCopy())showModal();});
    }else if(!legacyCopy())showModal();
  }

  render(){
    if(this.state.error){
      var msg=String(this.state.error.message||this.state.error);
      return h('div',{style:{padding:22,color:'#fecaca',font:'14px system-ui',lineHeight:1.5}},
        h('b',null,'MyCricStats could not render this page.'),

  }
}
